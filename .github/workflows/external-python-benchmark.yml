name: external-python-benchmark

on:
  push:
    branches:
      - fix/regressions-unstring-delimiters-vs-48
    paths:
      - "cobol2py.py"
      - "web/index.html"
      - "tests/test_divide_verb_compat.py"
      - "tests/test_numval_c_currency.py"
      - ".github/workflows/external-python-benchmark.yml"
  pull_request:
    paths:
      - "cobol2py.py"
      - "ronin/**"
      - "tests/test_sota_repair.py"
      - "benchmarks/run_external_corpus.py"
      - "benchmarks/Dockerfile.external"
      - ".github/workflows/external-python-benchmark.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Eligible COBOL programs per half (full benchmark uses 500)"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: external-python-benchmark-${{ github.event.pull_request.number || github.ref }}
  # A newer revision supersedes stale PR benchmark work; fixed shards are only
  # dispatched deliberately when a full run is required.
  cancel-in-progress: true

jobs:
  external-python:
    strategy:
      fail-fast: false
      # Decision 2026-10-31: use only the fixed 500-case second half for
      # ongoing candidate evaluation. The former primary half is not used
      # for tuning or as a release gate. This corpus is now a repeatedly
      # observed evaluation set, not an untouched statistical holdout.
      # PRs get a cheap 50-program screen. Run the full 500-case gate manually
      # (workflow_dispatch) before accepting a candidate; do not tune to this subset.
      matrix:
        sample: ${{ github.event_name == 'pull_request' && fromJSON('[{"name":"fast-screen","skip":500,"target":50}]') || fromJSON('[{"name":"holdout-0","skip":500,"target":125},{"name":"holdout-1","skip":625,"target":125},{"name":"holdout-2","skip":750,"target":125},{"name":"holdout-3","skip":875,"target":125}]') }}
    runs-on: ubuntu-latest
    # Each shard previously hit the 10-minute wall-clock cap before writing its report.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent translation cache directory
        run: mkdir -p "$RUNNER_TEMP/translation-cache"
      - name: Restore exact-match translation cache
        id: translation-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/translation-cache
          key: translation-cache-v1-${{ matrix.sample.name }}-${{ hashFiles('cobol2py.py', 'ronin/compiler_guided_repair.py') }}
          restore-keys: |
            translation-cache-v1-${{ matrix.sample.name }}-
      - name: Restore pinned X-COBOL v2 archive cache
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-cbd974caed72b0836777dc2305928ed3

      - name: Download and verify pinned X-COBOL v2 archive
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/external-python-start-time"
          archive="$RUNNER_TEMP/COBOL_Files.zip"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" \
              --output "$archive"
          fi
          echo "Archive size: $(du -h "$archive" | cut -f1)"
          echo "cbd974caed72b0836777dc2305928ed3  $archive" | md5sum --check -

      - name: Save verified corpus archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-cbd974caed72b0836777dc2305928ed3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build isolated benchmark image with layer cache
        env:
          CACHE_SCOPE: external-benchmark-${{ github.workflow }}-${{ matrix.sample.name }}
          CACHE_PEER_SCOPE: external-benchmark-${{ github.workflow }}-${{ matrix.sample.name == 'primary' && 'holdout' || 'primary' }}
          CACHE_CROSS_WORKFLOW_SCOPE: external-benchmark-external-cobol-corpus-${{ matrix.sample.name }}
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$CACHE_SCOPE" \
            --cache-from "type=gha,scope=$CACHE_PEER_SCOPE" \
            --cache-from "type=gha,scope=$CACHE_CROSS_WORKFLOW_SCOPE" \
            --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE" \
            -f benchmarks/Dockerfile.external \
            -t cobol2py-external-benchmark .
      - name: Capture current main translator for timing comparison
        shell: bash
        run: |
          git fetch --no-tags origin main
          git show origin/main:cobol2py.py > "$RUNNER_TEMP/current-cobol2py.py"
          test -s "$RUNNER_TEMP/current-cobol2py.py"
      - name: Run the reference-comparable Python benchmark
        env:
          TARGET: ${{ matrix.sample.target }}
          OUTPUT_DIR: ${{ runner.temp }}/external-python-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: external-python-${{ github.run_id }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME" "$RUNNER_TEMP/translation-cache"
          # GitHub Actions cache restores can preserve read-only SQLite file
          # modes. The benchmark container must update the DB and create journals.
          find "$RUNNER_TEMP/translation-cache" -type d -exec chmod 0777 {} +
          find "$RUNNER_TEMP/translation-cache" -type f -exec chmod 0666 {} +
          set +e
          docker run --name "$CONTAINER_NAME" \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=4g \
            --cpus=2 \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/COBOL_Files.zip,target=/input.zip,readonly" \
            --mount "type=bind,source=$OUTPUT_DIR,target=/output" \
            --mount "type=bind,source=$RUNNER_TEMP/translation-cache,target=/cache" \
            --mount "type=bind,source=$RUNNER_TEMP/current-cobol2py.py,target=/baseline/cobol2py.py,readonly" \
            --workdir /workspace \
            cobol2py-external-benchmark \
            benchmarks/run_external_corpus.py \
            --translator /workspace/cobol2py.py \
            --archive /input.zip \
            --output "/output/$SAMPLE_NAME" \
            --target "$TARGET" \
            --skip "$SKIP" \
            --cache-path /cache/translation-cache.sqlite3 \
            --baseline-translator /baseline/cobol2py.py \
            --diagnostics
          status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1
          exit "$status"
      - name: Save exact-match translation cache
        if: always() && steps.translation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/translation-cache
          key: translation-cache-v1-${{ matrix.sample.name }}-${{ hashFiles('cobol2py.py', 'ronin/compiler_guided_repair.py') }}
      - name: Publish benchmark report
        if: always()
        run: |
          file="$RUNNER_TEMP/external-python-artifacts/${{ matrix.sample.name }}/external-corpus-report.md"
          started="$(cat "$RUNNER_TEMP/external-python-start-time" 2>/dev/null || date +%s)"
          finished="$(date +%s)"
          elapsed="$((finished - started))"
          echo "## ${{ matrix.sample.name }} sample — workflow timing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed seconds (setup, image build, benchmark and report): **${elapsed}s**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$file" ]; then
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced; inspect the benchmark logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark report without source corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-python-report-${{ matrix.sample.name }}-${{ github.run_number }}
          path: ${{ runner.temp }}/external-python-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

