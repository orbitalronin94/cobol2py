name: external-python-benchmark

on:
  pull_request:
    paths:
      - "cobol2py.py"
      - "benchmarks/run_external_corpus.py"
      - "benchmarks/Dockerfile.external"
      - ".github/workflows/external-python-benchmark.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Eligible COBOL programs per half (full benchmark uses 500)"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: external-python-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-python:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'experiment/')
    strategy:
      fail-fast: false
      # Decision 2026-10-31: use only the fixed 500-case second half for
      # ongoing candidate evaluation. The former primary half is not used
      # for tuning or as a release gate. This corpus is now a repeatedly
      # observed evaluation set, not an untouched statistical holdout.
      matrix:
        sample:
          - { name: holdout-0, skip: 500, target: 125 }
          - { name: holdout-1, skip: 625, target: 125 }
          - { name: holdout-2, skip: 750, target: 125 }
          - { name: holdout-3, skip: 875, target: 125 }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned X-COBOL v2 archive cache
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-cbd974caed72b0836777dc2305928ed3

      - name: Download and verify pinned X-COBOL v2 archive
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/external-python-start-time"
          archive="$RUNNER_TEMP/COBOL_Files.zip"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" \
              --output "$archive"
          fi
          echo "Archive size: $(du -h "$archive" | cut -f1)"
          echo "cbd974caed72b0836777dc2305928ed3  $archive" | md5sum --check -

      - name: Save verified corpus archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-cbd974caed72b0836777dc2305928ed3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build isolated benchmark image with layer cache
        env:
          CACHE_SCOPE: external-benchmark-${{ github.workflow }}-${{ matrix.sample.name }}
          CACHE_PEER_SCOPE: external-benchmark-${{ github.workflow }}-${{ matrix.sample.name == 'primary' && 'holdout' || 'primary' }}
          CACHE_CROSS_WORKFLOW_SCOPE: external-benchmark-external-cobol-corpus-${{ matrix.sample.name }}
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$CACHE_SCOPE" \
            --cache-from "type=gha,scope=$CACHE_PEER_SCOPE" \
            --cache-from "type=gha,scope=$CACHE_CROSS_WORKFLOW_SCOPE" \
            --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE" \
            -f benchmarks/Dockerfile.external \
            -t cobol2py-external-benchmark .
      - name: Run the reference-comparable Python benchmark
        env:
          TARGET: ${{ matrix.sample.target }}
          OUTPUT_DIR: ${{ runner.temp }}/external-python-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: external-python-${{ github.run_id }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME"
          set +e
          docker run --name "$CONTAINER_NAME" \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=4g \
            --cpus=2 \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/COBOL_Files.zip,target=/input.zip,readonly" \
            --mount "type=bind,source=$OUTPUT_DIR,target=/output" \
            --workdir /workspace \
            cobol2py-external-benchmark \
            benchmarks/run_external_corpus.py \
            --translator /workspace/cobol2py.py \
            --archive /input.zip \
            --output "/output/$SAMPLE_NAME" \
            --target "$TARGET" \
            --skip "$SKIP" \
            --diagnostics
          status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1
          exit "$status"
      - name: Publish exact-match scorecard
        if: always()
        run: |
          file="$RUNNER_TEMP/external-python-artifacts/${{ matrix.sample.name }}/external-corpus-report.md"
          started="$(cat "$RUNNER_TEMP/external-python-start-time" 2>/dev/null || date +%s)"
          finished="$(date +%s)"
          elapsed="$((finished - started))"
          echo "## ${{ matrix.sample.name }} sample — workflow timing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed seconds (setup, image build, benchmark and report): **${elapsed}s**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$file" ]; then
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced; inspect the benchmark logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scorecard without source corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-python-corpus-${{ matrix.sample.name }}-${{ github.run_number }}
          path: ${{ runner.temp }}/external-python-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  aggregate-scorecard:
    if: always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'experiment/'))
    needs: external-python
    runs-on: ubuntu-latest
    steps:
      - name: Download both sample reports
        uses: actions/download-artifact@v4
        with:
          pattern: external-python-corpus-*-${{ github.run_number }}
          path: ${{ runner.temp }}/python-scorecard
      - name: Enforce strict improvement over frozen main baseline
        shell: python
        env:
          REPORT_ROOT: ${{ runner.temp }}/python-scorecard
        run: |
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["REPORT_ROOT"])
          reports = []
          for filename in root.rglob("external-corpus-report.json"):
              with filename.open(encoding="utf-8") as handle:
                  reports.append(json.load(handle))

          expected_skips = {500, 625, 750, 875}
          by_skip = {int(report.get("skip", -1)): report for report in reports}
          if set(by_skip) != expected_skips or len(reports) != 4:
              raise SystemExit(
                  f"Expected four holdout shards {sorted(expected_skips)}; "
                  f"found {[(r.get('skip'), r.get('target'), r.get('tested')) for r in reports]}"
              )

          for skip in sorted(expected_skips):
              shard = by_skip[skip]
              if not shard.get("archive_md5_verified"):
                  raise SystemExit(f"Shard skip={skip}: X-COBOL v2 archive checksum was not verified")
              if not shard.get("sample_complete") or int(shard.get("tested", 0)) != 125:
                  raise SystemExit(f"Shard skip={skip}: expected a complete 125-program shard")
              if int(shard.get("target", 0)) != 125:
                  raise SystemExit(f"Shard skip={skip}: benchmark target was not 125")

          passed = sum(int(by_skip[skip].get("passed", 0)) for skip in expected_skips)
          tested = sum(int(by_skip[skip].get("tested", 0)) for skip in expected_skips)
          baseline = 236
          delta = passed - baseline
          percent = 100.0 * passed / tested
          reached = passed > baseline

          summary = [
              "## X-COBOL v2 holdout-only evaluation gate — 4-way matrix",
              "",
              "| Fixed evaluation corpus | Candidate | Frozen reference | Delta |",
              "|---|---:|---:|---:|",
              f"| Holdout half | {passed}/{tested} ({percent:.2f}%) | 236/500 (47.20%) | {delta:+d} |",
              "",
              "- Shards: **4 × 125**, all complete and checksum-verified",
              "- Primary half: **not run and not used for candidate tuning/gating**",
              f"- Strict improvement over frozen reference: **{reached}**",
              f"- **Gate: {'PASS' if reached else 'FAIL'}**",
              "",
              "Design decision (2026-10-31): evaluate only the fixed second 500-case half to reduce wall-clock time. Repeated tuning on this set means it is an evaluation set, not an untouched statistical holdout. Preserve selection, denominator, and exclusions.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          if not reached:
              raise SystemExit("Holdout-only exact-match score did not strictly improve over 236/500.")
