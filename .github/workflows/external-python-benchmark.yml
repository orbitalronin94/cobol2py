name: external-python-benchmark

on:
  pull_request:
    paths:
      - "cobol2py.py"
      - "benchmarks/run_external_corpus.py"
      - "benchmarks/Dockerfile.external"
      - ".github/workflows/external-python-benchmark.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Eligible COBOL programs per half (full benchmark uses 500)"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: external-python-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  external-python:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'experiment/')
    strategy:
      fail-fast: false
      matrix:
        sample:
          - { name: primary, skip: 0 }
          - { name: holdout, skip: 500 }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned X-COBOL v2 archive cache
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-${{ github.workflow }}-${{ matrix.sample.name }}-cbd974caed72b0836777dc2305928ed3

      - name: Download and verify pinned X-COBOL v2 archive
        shell: bash
        run: |
          archive="$RUNNER_TEMP/COBOL_Files.zip"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" \
              --output "$archive"
          fi
          echo "Archive size: $(du -h "$archive" | cut -f1)"
          echo "cbd974caed72b0836777dc2305928ed3  $archive" | md5sum --check -

      - name: Save verified corpus archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-${{ github.workflow }}-${{ matrix.sample.name }}-cbd974caed72b0836777dc2305928ed3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build isolated benchmark image with layer cache
        env:
          CACHE_SCOPE: external-benchmark-${{ github.workflow }}-${{ matrix.sample.name }}
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$CACHE_SCOPE" \
            --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE" \
            -f benchmarks/Dockerfile.external \
            -t cobol2py-external-benchmark .
      - name: Run the reference-comparable Python benchmark
        env:
          TARGET: ${{ inputs.target || '500' }}
          OUTPUT_DIR: ${{ runner.temp }}/external-python-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: external-python-${{ github.run_id }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME"
          set +e
          docker run --name "$CONTAINER_NAME" \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=4g \
            --cpus=2 \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/COBOL_Files.zip,target=/input.zip,readonly" \
            --mount "type=bind,source=$OUTPUT_DIR,target=/output" \
            --workdir /workspace \
            cobol2py-external-benchmark \
            benchmarks/run_external_corpus.py \
            --translator /workspace/cobol2py.py \
            --archive /input.zip \
            --output "/output/$SAMPLE_NAME" \
            --target "$TARGET" \
            --skip "$SKIP" \
            --diagnostics
          status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1
          exit "$status"
      - name: Publish exact-match scorecard
        if: always()
        run: |
          file="$RUNNER_TEMP/external-python-artifacts/$SAMPLE_NAME/external-corpus-report.md"
          if [ -f "$file" ]; then
            echo "## $SAMPLE_NAME sample" >> "$GITHUB_STEP_SUMMARY"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced; inspect the benchmark logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scorecard without source corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-python-corpus-${{ matrix.sample.name }}-${{ github.run_number }}
          path: ${{ runner.temp }}/external-python-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate-scorecard:
    if: always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'experiment/'))
    needs: external-python
    runs-on: ubuntu-latest
    steps:
      - name: Download both sample reports
        uses: actions/download-artifact@v4
        with:
          pattern: external-python-corpus-*-${{ github.run_number }}
          path: ${{ runner.temp }}/python-scorecard
      - name: Calculate the 1,000-program target
        shell: python
        env:
          REPORT_ROOT: ${{ runner.temp }}/python-scorecard
        run: |
          import glob
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["REPORT_ROOT"])
          reports = []
          for filename in root.rglob("external-corpus-report.json"):
              with filename.open(encoding="utf-8") as handle:
                  reports.append(json.load(handle))
          tested = sum(int(report.get("tested", 0)) for report in reports)
          passed = sum(int(report.get("passed", 0)) for report in reports)
          percent = 100.0 * passed / tested if tested else 0.0
          full_sample = tested == 1000
          baseline = 37.5
          target = baseline + 5.0
          reached = full_sample and percent >= target
          summary = [
              "## External Python target",
              "",
              f"- Exact matches: **{passed}/{tested} ({percent:.2f}%)**",
              f"- Reference baseline: **{baseline:.2f}%**",
              f"- Required target: **{target:.2f}%** (+5.00 percentage points)",
              f"- Improvement vs baseline: **{percent - baseline:+.2f} percentage points**",
              f"- Full 1,000-program sample: **{full_sample}**",
              f"- Target reached: **{reached}**",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary))
          print("\n".join(summary))
          if not reports:
              raise SystemExit("No benchmark reports found; inspect the sample jobs.")
