name: external-python-benchmark

on:
  pull_request:
    paths:
      - "cobol2py.py"
      - "ronin/**"
      - "tests/test_sota_repair.py"
      - "benchmarks/run_external_corpus.py"
      - "benchmarks/Dockerfile.external"
      - ".github/workflows/external-python-benchmark.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Eligible COBOL programs per half (full benchmark uses 500)"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: external-python-benchmark-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a fixed-corpus shard because another run is queued.
  cancel-in-progress: false

jobs:
  external-python:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'experiment/')
    strategy:
      fail-fast: false
      # Decision 2026-10-31: use only the fixed 500-case second half for
      # ongoing candidate evaluation. The former primary half is not used
      # for tuning or as a release gate. This corpus is now a repeatedly
      # observed evaluation set, not an untouched statistical holdout.
      # PRs get a cheap 50-program screen. Run the full 500-case gate manually
      # (workflow_dispatch) before accepting a candidate; do not tune to this subset.
      matrix:
        sample: ${{ github.event_name == 'pull_request' && fromJSON('[{"name":"fast-screen","skip":500,"target":50}]') || fromJSON('[{"name":"holdout-0","skip":500,"target":125},{"name":"holdout-1","skip":625,"target":125},{"name":"holdout-2","skip":750,"target":125},{"name":"holdout-3","skip":875,"target":125}]') }}
    runs-on: ubuntu-latest
    # Each shard previously hit the 10-minute wall-clock cap before writing its report.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent translation cache directory
        run: mkdir -p "$RUNNER_TEMP/translation-cache"
      - name: Restore exact-match translation cache
        id: translation-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/translation-cache
          key: translation-cache-v1-${{ matrix.sample.name }}-${{ hashFiles('cobol2py.py', 'ronin/compiler_guided_repair.py') }}
          restore-keys: |
            translation-cache-v1-${{ matrix.sample.name }}-
      - name: Restore pinned X-COBOL v2 archive cache
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-cbd974caed72b0836777dc2305928ed3

      - name: Download and verify pinned X-COBOL v2 archive
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/external-python-start-time"
          archive="$RUNNER_TEMP/COBOL_Files.zip"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" \
              --output "$archive"
          fi
          echo "Archive size: $(du -h "$archive" | cut -f1)"
          echo "cbd974caed72b0836777dc2305928ed3  $archive" | md5sum --check -

      - name: Save verified corpus archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/COBOL_Files.zip
          key: x-cobol-v2-cbd974caed72b0836777dc2305928ed3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build isolated benchmark image with layer cache
        env:
          CACHE_SCOPE: external-benchmark-${{ github.workflow }}-${{ matrix.sample.name }}
          CACHE_PEER_SCOPE: external-benchmark-${{ github.workflow }}-${{ matrix.sample.name == 'primary' && 'holdout' || 'primary' }}
          CACHE_CROSS_WORKFLOW_SCOPE: external-benchmark-external-cobol-corpus-${{ matrix.sample.name }}
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$CACHE_SCOPE" \
            --cache-from "type=gha,scope=$CACHE_PEER_SCOPE" \
            --cache-from "type=gha,scope=$CACHE_CROSS_WORKFLOW_SCOPE" \
            --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE" \
            -f benchmarks/Dockerfile.external \
            -t cobol2py-external-benchmark .
      - name: Capture current main translator for timing comparison
        shell: bash
        run: |
          git fetch --no-tags origin main
          git show origin/main:cobol2py.py > "$RUNNER_TEMP/current-cobol2py.py"
          test -s "$RUNNER_TEMP/current-cobol2py.py"
      - name: Run the reference-comparable Python benchmark
        env:
          TARGET: ${{ matrix.sample.target }}
          OUTPUT_DIR: ${{ runner.temp }}/external-python-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: external-python-${{ github.run_id }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME" "$RUNNER_TEMP/translation-cache"
          set +e
          docker run --name "$CONTAINER_NAME" \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=4g \
            --cpus=2 \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/COBOL_Files.zip,target=/input.zip,readonly" \
            --mount "type=bind,source=$OUTPUT_DIR,target=/output" \
            --mount "type=bind,source=$RUNNER_TEMP/translation-cache,target=/cache" \
            --mount "type=bind,source=$RUNNER_TEMP/current-cobol2py.py,target=/baseline/cobol2py.py,readonly" \
            --workdir /workspace \
            cobol2py-external-benchmark \
            benchmarks/run_external_corpus.py \
            --translator /workspace/cobol2py.py \
            --archive /input.zip \
            --output "/output/$SAMPLE_NAME" \
            --target "$TARGET" \
            --skip "$SKIP" \
            --cache-path /cache/translation-cache.sqlite3 \
            --baseline-translator /baseline/cobol2py.py \
            --diagnostics
          status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1
          exit "$status"
      - name: Save exact-match translation cache
        if: always() && steps.translation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/translation-cache
          key: translation-cache-v1-${{ matrix.sample.name }}-${{ hashFiles('cobol2py.py', 'ronin/compiler_guided_repair.py') }}
      - name: Publish exact-match scorecard
        if: always()
        run: |
          file="$RUNNER_TEMP/external-python-artifacts/${{ matrix.sample.name }}/external-corpus-report.md"
          started="$(cat "$RUNNER_TEMP/external-python-start-time" 2>/dev/null || date +%s)"
          finished="$(date +%s)"
          elapsed="$((finished - started))"
          echo "## ${{ matrix.sample.name }} sample — workflow timing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed seconds (setup, image build, benchmark and report): **${elapsed}s**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$file" ]; then
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced; inspect the benchmark logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scorecard without source corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-python-corpus-${{ matrix.sample.name }}-${{ github.run_number }}
          path: ${{ runner.temp }}/external-python-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  aggregate-scorecard:
    if: always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'experiment/'))
    needs: external-python
    runs-on: ubuntu-latest
    steps:
      - name: Download benchmark reports
        uses: actions/download-artifact@v4
        with:
          pattern: external-python-corpus-*-${{ github.run_number }}
          path: ${{ runner.temp }}/python-scorecard
      - name: Enforce dynamic fast-screen / best-score gate
        id: gate
        shell: python
        env:
          REPORT_ROOT: ${{ runner.temp }}/python-scorecard
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_OUTPUT: ${{ runner.temp }}/gate-output
        run: |
          import json, math, os, subprocess
          from pathlib import Path

          subprocess.run(["git", "fetch", "--no-tags", "origin", "main"], check=True)
          baseline = json.loads(subprocess.check_output(
              ["git", "show", "origin/main:benchmarks/holdout_best.json"], text=True
          ))
          best_passed = int(baseline["best_passed"])
          best_tested = int(baseline["best_tested"])
          best_rate = best_passed / best_tested

          root = Path(os.environ["REPORT_ROOT"])
          reports = []
          for filename in root.rglob("external-corpus-report.json"):
              with filename.open(encoding="utf-8") as handle:
                  reports.append(json.load(handle))

          fast = os.environ["EVENT_NAME"] == "pull_request"
          expected = {500} if fast else {500, 625, 750, 875}
          by_skip = {int(report.get("skip", -1)): report for report in reports}
          if set(by_skip) != expected or len(reports) != len(expected):
              raise SystemExit(
                  f"Expected skips {sorted(expected)}; found "
                  f"{[(r.get('skip'), r.get('target'), r.get('tested')) for r in reports]}"
              )

          for skip in sorted(expected):
              shard = by_skip[skip]
              target = 50 if fast else 125
              if not shard.get("archive_md5_verified"):
                  raise SystemExit(f"Shard skip={skip}: archive checksum was not verified")
              if not shard.get("sample_complete") or int(shard.get("tested", 0)) != target:
                  raise SystemExit(f"Shard skip={skip}: expected a complete {target}-program shard")
              if int(shard.get("target", 0)) != target:
                  raise SystemExit(f"Shard skip={skip}: target mismatch")

          passed = sum(int(by_skip[skip].get("passed", 0)) for skip in expected)
          tested = sum(int(by_skip[skip].get("tested", 0)) for skip in expected)
          threshold = math.floor(best_rate * tested) + 1
          reached = passed >= threshold
          percent = 100.0 * passed / tested
          if fast:
              heading = "50-case fast screen (PR filter)"
              detail = "Filter only. A full 500-case evaluation must beat the latest recorded best before acceptance."
          else:
              heading = "X-COBOL v2 full 500-case evaluation gate"
              detail = "All four 125-program shards were checksum-verified and complete."
          summary = [
              f"## {heading}", "",
              "| Evaluation | Candidate | Previous best | Required to beat best | Gate |", "|---|---:|---:|---:|---|",
              f"| Fixed evaluation corpus | {passed}/{tested} ({percent:.2f}%) | {best_passed}/{best_tested} ({best_rate*100:.2f}%) | {threshold}/{tested} | {'PASS' if reached else 'FAIL'} |",
              "", f"- {detail}",
              "- The 50-case subset is a filter, not a release score; the repeatedly observed fixed corpus is not an untouched statistical holdout.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\\n".join(summary) + "\\n")
          print("\\n".join(summary))
          with open(os.environ["GITHUB_OUTPUT"], "w", encoding="utf-8") as handle:
              handle.write(f"passed={passed}\\n")
              handle.write(f"tested={tested}\\n")
              handle.write(f"best_passed={best_passed}\\n")
              handle.write(f"best_tested={best_tested}\\n")
              handle.write(f"reached={'true' if reached else 'false'}\\n")
          if not reached:
              raise SystemExit(f"Benchmark gate failed: {passed}/{tested}; must strictly beat {best_passed}/{best_tested} ({best_rate*100:.2f}%).")

      - name: Advance recorded best after a winning full run on main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.gate.outputs.reached == 'true' && steps.gate.outputs.tested == '500'
        uses: actions/github-script@v7
        env:
          PASSED: ${{ steps.gate.outputs.passed }}
          TESTED: ${{ steps.gate.outputs.tested }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = "benchmarks/holdout_best.json";
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: "main" });
            const previous = JSON.parse(Buffer.from(current.data.content, "base64").toString("utf8"));
            const passed = Number(process.env.PASSED);
            const tested = Number(process.env.TESTED);
            if (tested !== 500 || passed / tested <= Number(previous.best_passed) / Number(previous.best_tested)) {
              core.setFailed("Refusing to replace best score: result is incomplete or does not beat current best.");
              return;
            }
            const next = {
              corpus: "X-COBOL v2 fixed evaluation half",
              best_passed: passed,
              best_tested: tested,
              best_percent: Number((100 * passed / tested).toFixed(2)),
              source_pr: null,
              source_commit: context.sha,
              updated_at: new Date().toISOString().slice(0, 10),
              policy: "Updated only by a complete, checksum-verified 500-case run on main that strictly beats the previously recorded rate. The 50-case PR screen is a filter only."
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `bench: advance best holdout score to ${passed}/${tested}`,
              content: Buffer.from(JSON.stringify(next, null, 2) + "\\n").toString("base64"),
              sha: current.data.sha,
              branch: "main"
            });
            core.info(`Advanced best score to ${passed}/${tested} (${next.best_percent}%).`);
