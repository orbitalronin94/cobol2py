name: 30-seed failure-directed tournament

run-name: 30-seed COBOL failure tournament

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Maximum simultaneous candidate benchmarks"
        required: true
        type: choice
        options: ["2", "4", "6", "8"]
        default: "4"

permissions:
  contents: read

concurrency:
  group: cobol2py-failure-tournament
  cancel-in-progress: false

jobs:
  discover:
    name: Freeze baseline and 30 candidate revisions
    runs-on: ubuntu-latest
    outputs:
      baseline_sha: ${{ steps.freeze.outputs.baseline_sha }}
      candidates: ${{ steps.freeze.outputs.candidates }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Resolve all 30 manifest branches to immutable SHAs
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("experiments/failure-tournament/manifest.json").read_text())
          assert len(manifest["candidates"]) == 30, "Manifest must contain exactly 30 seeds"
          assert len({item["seed"] for item in manifest["candidates"]}) == 30, "Duplicate seed"
          assert len({item["branch"] for item in manifest["candidates"]}) == 30, "Duplicate branch"
          if manifest.get("readiness", {}).get("status") != "ready":
              raise SystemExit("Tournament blocked: candidate branches must be rebuilt and audited before dispatch")
          PY
          candidates='[]'
          candidate_shas='[]'
          while IFS=$'\t' read -r seed candidate_id branch; do
            encoded_branch=$(BRANCH="$branch" python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe="/"))')
            if ! ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_branch" 2>/dev/null); then
              echo "::error::Missing candidate branch for seed $seed: $branch"
              echo "Create and implement all 30 isolated candidate branches before dispatching."
              exit 1
            fi
            sha=$(jq -r '.object.sha' <<<"$ref")
            if [ "$sha" = "$baseline_sha" ]; then
              echo "::error::Seed $seed points to baseline unchanged ($branch)"
              exit 1
            fi
            if jq -e --arg sha "$sha" 'index($sha) != null' <<<"$candidate_shas" >/dev/null; then
              echo "::error::Two manifest seeds resolve to the same candidate SHA: $sha"
              exit 1
            fi
            candidate_shas=$(jq -cn --argjson old "$candidate_shas" --arg sha "$sha" '$old + [$sha]')
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$baseline_sha...$sha")
            comparison_status=$(jq -r '.status' <<<"$comparison")
            if [ "$comparison_status" != "ahead" ]; then
              echo "::error::Seed $seed is stale or diverged from frozen main ($branch; compare=$comparison_status)"
              echo "Rebuild this isolated candidate on top of the frozen main SHA before running the tournament."
              exit 1
            fi
            changed_paths=$(jq -r '.files[]?.filename' <<<"$comparison")
            if ! grep -Eq '^(cobol2py\.py|ronin/|web/index\.html$)' <<<"$changed_paths"; then
              echo "::error::Seed $seed has no translator implementation change ($branch)"
              exit 1
            fi
            if ! grep -Eq '^tests/' <<<"$changed_paths"; then
              echo "::error::Seed $seed has no regression test or reproducer change ($branch)"
              exit 1
            fi
            item=$(jq -cn --arg seed "$seed" --arg id "$candidate_id" --arg branch "$branch" --arg sha "$sha" \
              '{seed:($seed|tonumber),id:$id,branch:$branch,sha:$sha}')
            candidates=$(jq -cn --argjson old "$candidates" --argjson item "$item" '$old + [$item]')
          done < <(python - <<'PY'
          import json
          from pathlib import Path
          for item in json.loads(Path("experiments/failure-tournament/manifest.json").read_text())["candidates"]:
              print(f'{item["seed"]}\t{item["id"]}\t{item["branch"]}')
          PY
          )
          test "$(jq 'length' <<<"$candidates")" -eq 30
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "## Frozen tournament revisions"
            printf '%s\n' "- Baseline SHA: $baseline_sha"
            printf '%s\n' "- Candidate branches: $(jq 'length' <<<"$candidates")"
            echo "$candidates" | jq -r '.[] | "- Seed \(.seed): `\(.id)` — `\(.sha)`"'
          } >> "$GITHUB_STEP_SUMMARY"

  baseline:
    name: Frozen main baseline — 500 holdout cases
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.discover.outputs.baseline_sha }}
      - name: Record frozen baseline identity
        env:
          EXPECTED_SHA: ${{ needs.discover.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SHA"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          data = {
              "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "translator_sha256": hashlib.sha256(Path("cobol2py.py").read_bytes()).hexdigest(),
          }
          Path(os.environ["RUNNER_TEMP"], "baseline", "baseline-identity.json").write_text(
              json.dumps(data, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Download pinned X-COBOL v2 archive
        run: curl --fail --location --retry 3 --retry-delay 2 "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" --output /tmp/COBOL_Files.zip
      - name: Build isolated benchmark image
        run: docker build -f benchmarks/Dockerfile.external -t cobol2py-failure-tournament .
      - name: Run exact 500-case holdout baseline
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          chmod 0777 "$RUNNER_TEMP/baseline"
          docker run --rm --network none --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --memory=4g --cpus=2 --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=/tmp/COBOL_Files.zip,target=/input.zip,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/baseline,target=/output" \
            --workdir /workspace cobol2py-failure-tournament \
            benchmarks/run_external_corpus.py --translator /workspace/cobol2py.py \
            --archive /input.zip --output /output --target 500 --skip 500
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: failure-tournament-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/baseline/
          if-no-files-found: error
          retention-days: 30

  candidates:
    name: Seed ${{ matrix.candidate.seed }} — ${{ matrix.candidate.id }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '4') }}
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.candidate.sha }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.discover.outputs.baseline_sha }}
          path: benchmark-harness
      - name: Freeze benchmark runner from main baseline
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          cp benchmark-harness/benchmarks/run_external_corpus.py benchmarks/run_external_corpus.py
      - name: Verify candidate checkout SHA
        id: checkout-sha
        env:
          EXPECTED_SHA: ${{ matrix.candidate.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          echo "actual_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run complete unit and regression suite
        id: unit
        run: python -m unittest discover -s tests -v
      - name: Download pinned X-COBOL v2 archive
        if: steps.unit.outcome == 'success'
        run: curl --fail --location --retry 3 --retry-delay 2 "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" --output /tmp/COBOL_Files.zip
      - name: Build isolated benchmark image
        if: steps.unit.outcome == 'success'
        run: docker build -f benchmark-harness/benchmarks/Dockerfile.external -t cobol2py-failure-tournament .
      - name: Run exact 500-case holdout
        if: steps.unit.outcome == 'success'
        env:
          SEED: ${{ matrix.candidate.seed }}
          CANDIDATE_ID: ${{ matrix.candidate.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          chmod 0777 "$RUNNER_TEMP/candidate"
          docker run --rm --network none --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --memory=4g --cpus=2 --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=/tmp/COBOL_Files.zip,target=/input.zip,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/candidate,target=/output" \
            --workdir /workspace cobol2py-failure-tournament \
            benchmarks/run_external_corpus.py --translator /workspace/cobol2py.py \
            --archive /input.zip --output /output --target 500 --skip 500
      - name: Record candidate identity and test outcome
        if: always()
        env:
          SEED: ${{ matrix.candidate.seed }}
          CANDIDATE_ID: ${{ matrix.candidate.id }}
          BRANCH: ${{ matrix.candidate.branch }}
          EXPECTED_SHA: ${{ matrix.candidate.sha }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          translator_sha256 = hashlib.sha256(Path("cobol2py.py").read_bytes()).hexdigest()
          expected_sha = os.environ["EXPECTED_SHA"]
          data = {
              "seed": int(os.environ["SEED"]),
              "id": os.environ["CANDIDATE_ID"],
              "branch": os.environ["BRANCH"],
              "sha": expected_sha,
              "head_sha": actual_sha,
              "translator_sha256": translator_sha256,
              "unit_tests": os.environ.get("UNIT_OUTCOME"),
              "tests_passed": os.environ.get("UNIT_OUTCOME") == "success" and actual_sha == expected_sha,
          }
          Path(os.environ["RUNNER_TEMP"], "candidate-result.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: failure-tournament-seed-${{ matrix.candidate.seed }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate/
            ${{ runner.temp }}/candidate-result.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Casewise zero-regression ranking
    if: always() && needs.discover.result == 'success'
    needs: [discover, baseline, candidates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          pattern: failure-tournament-*-${{ github.run_id }}
          path: ${{ runner.temp }}/artifacts
          merge-multiple: false
      - name: Compare all candidates by exact case ID
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/artifacts
          CANDIDATES_JSON: ${{ needs.discover.outputs.candidates }}
          BASELINE_SHA: ${{ needs.discover.outputs.baseline_sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_ROOT"])
          candidates = json.loads(os.environ["CANDIDATES_JSON"])
          if len(candidates) != 30:
              raise SystemExit(f"Expected 30 frozen candidates, found {len(candidates)}")

          baseline_files = list(root.glob("failure-tournament-baseline-*/external-corpus-report.json"))
          if len(baseline_files) != 1:
              raise SystemExit(f"Expected one baseline report, found {len(baseline_files)}")
          baseline_path = baseline_files[0]
          baseline = json.loads(baseline_path.read_text())
          baseline_identity_path = baseline_path.parent / "baseline-identity.json"
          if not baseline_identity_path.is_file():
              raise SystemExit("Frozen baseline identity artifact is missing")
          baseline_identity = json.loads(baseline_identity_path.read_text())
          if baseline_identity.get("sha") != os.environ["BASELINE_SHA"]:
              raise SystemExit("Baseline artifact SHA does not match the frozen main SHA")
          if len(baseline_identity.get("translator_sha256", "")) != 64:
              raise SystemExit("Baseline translator fingerprint is missing or malformed")

          expected_selection = (
              "Deterministic SHA-256 ordering of unique source contents; skip the first --skip "
              "sources that compile and terminate under GnuCOBOL, then test the next --target eligible sources."
          )
          expected_pass_definition = (
              "Exact stdout and process return-code match against a compiled GnuCOBOL executable."
          )
          if (
              baseline.get("tested") != 500
              or baseline.get("target") != 500
              or baseline.get("skip") != 500
              or baseline.get("sample_complete") is not True
              or baseline.get("archive_md5_verified") is not True
              or baseline.get("archive_md5_expected") != "cbd974caed72b0836777dc2305928ed3"
              or baseline.get("dataset_url") != "https://zenodo.org/records/14269462"
              or baseline.get("selection") != expected_selection
              or baseline.get("pass_definition") != expected_pass_definition
          ):
              raise SystemExit("Frozen main baseline is incomplete or violates the pinned X-COBOL v2 contract")

          baseline_rows = baseline.get("results", [])
          if len(baseline_rows) != 500:
              raise SystemExit(f"Baseline has {len(baseline_rows)} result rows, expected 500")
          base = {}
          for item in baseline_rows:
              case_id = item.get("id")
              status = item.get("status")
              if not case_id or case_id in base or status not in ("passed", "failed"):
                  raise SystemExit("Baseline has a missing/duplicate case ID or invalid result status")
              if status == "passed" and (
                  item.get("stdout_match") is not True or item.get("returncode_match") is not True
              ):
                  raise SystemExit(f"Baseline pass does not prove exact stdout and return-code match: {case_id}")
              base[case_id] = status == "passed"
          baseline_score = sum(base.values())
          if (
              len(base) != 500
              or baseline.get("passed") != baseline_score
              or baseline.get("failed") != 500 - baseline_score
          ):
              raise SystemExit("Baseline counts do not agree with its 500 unique case results")

          rows = []
          incomplete = []
          for candidate in candidates:
              folders = list(root.glob(f"failure-tournament-seed-{candidate['seed']}-*/"))
              if len(folders) != 1:
                  reason = "missing or duplicate candidate artifact"
                  incomplete.append({"seed": candidate["seed"], "id": candidate["id"], "reason": reason})
                  rows.append({**candidate, "complete": False, "eligible": False, "reason": reason})
                  continue

              folder = folders[0]
              identity_path = folder / "candidate-result.json"
              report_path = folder / "candidate" / "external-corpus-report.json"
              if not identity_path.is_file():
                  reason = "missing identity/test result"
                  incomplete.append({"seed": candidate["seed"], "id": candidate["id"], "reason": reason})
                  rows.append({**candidate, "complete": False, "eligible": False, "reason": reason})
                  continue

              identity = json.loads(identity_path.read_text())
              identity_ok = (
                  identity.get("seed") == candidate["seed"]
                  and identity.get("id") == candidate["id"]
                  and identity.get("branch") == candidate["branch"]
                  and identity.get("sha") == candidate["sha"]
                  and identity.get("head_sha") == candidate["sha"]
                  and len(identity.get("translator_sha256", "")) == 64
                  and identity.get("tests_passed") is True
              )
              if not identity_ok:
                  reason = "candidate identity/SHA mismatch or full unit suite failed"
                  incomplete.append({"seed": candidate["seed"], "id": candidate["id"], "reason": reason})
                  rows.append({**candidate, "complete": False, "eligible": False, "reason": reason})
                  continue

              if not report_path.is_file():
                  reason = "complete 500-case benchmark report missing"
                  incomplete.append({"seed": candidate["seed"], "id": candidate["id"], "reason": reason})
                  rows.append({**candidate, "complete": False, "eligible": False, "reason": reason})
                  continue

              report = json.loads(report_path.read_text())
              report_rows = report.get("results", [])
              result_map = {}
              valid_rows = len(report_rows) == 500
              for item in report_rows:
                  case_id = item.get("id")
                  status = item.get("status")
                  if not case_id or case_id in result_map or status not in ("passed", "failed"):
                      valid_rows = False
                      continue
                  if status == "passed" and (
                      item.get("stdout_match") is not True or item.get("returncode_match") is not True
                  ):
                      valid_rows = False
                  result_map[case_id] = status == "passed"

              contract_keys = (
                  "dataset_url", "archive_md5_expected", "target", "skip",
                  "selection", "pass_definition",
              )
              contract_matches = all(report.get(key) == baseline.get(key) for key in contract_keys)
              candidate_score = sum(result_map.values())
              report_complete = (
                  contract_matches
                  and report.get("tested") == 500
                  and report.get("target") == 500
                  and report.get("skip") == 500
                  and report.get("sample_complete") is True
                  and report.get("archive_md5_verified") is True
                  and report.get("archive_md5_expected") == "cbd974caed72b0836777dc2305928ed3"
                  and valid_rows
                  and len(result_map) == 500
                  and set(result_map) == set(base)
                  and report.get("passed") == candidate_score
                  and report.get("failed") == 500 - candidate_score
              )
              if not report_complete:
                  reason = "incomplete/non-comparable holdout, checksum, denominator, IDs, or exact-match contract"
                  incomplete.append({"seed": candidate["seed"], "id": candidate["id"], "reason": reason})
                  rows.append({**candidate, "complete": False, "eligible": False, "reason": reason})
                  continue

              regressions = sorted(case for case in base if base[case] and not result_map[case])
              new_passes = sorted(case for case in base if not base[case] and result_map[case])
              rows.append({
                  **candidate,
                  "complete": True,
                  "score": candidate_score,
                  "new_passes": len(new_passes),
                  "regressions": len(regressions),
                  "eligible": len(new_passes) >= 1 and not regressions,
                  "reason": "eligible" if len(new_passes) >= 1 and not regressions else "zero-regression/gain gate failed",
                  "candidate_translation_seconds": report.get("candidate_translation_seconds"),
                  "new_pass_case_ids": new_passes,
                  "regressed_case_ids": regressions,
              })

          eligible = sorted(
              (item for item in rows if item.get("complete") and item.get("eligible")),
              key=lambda item: (
                  -item["new_passes"],
                  item["regressions"],
                  item.get("candidate_translation_seconds") or 1e99,
              ),
          )
          complete = len(candidates) == 30 and not incomplete
          summary = {
              "complete": complete,
              "baseline_sha": os.environ["BASELINE_SHA"],
              "baseline_score": baseline_score,
              "baseline_tested": baseline.get("tested"),
              "baseline_translator_sha256": baseline_identity["translator_sha256"],
              "candidates": rows,
              "incomplete_candidates": incomplete,
              "winner": eligible[0] if eligible and complete else None,
              "promotion": "not automatic",
          }
          out = Path(os.environ["GITHUB_WORKSPACE"], "failure-tournament-summary.json")
          out.write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps({key: value for key, value in summary.items() if key != "candidates"}, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(f"## 30-seed tournament\n\nComplete: **{complete}**\n\n")
              handle.write(f"Baseline: **{baseline_score}/500**\n\n")
              handle.write("| Seed | Candidate | Score | New passes | Regressions | Complete | Eligible |\n|---:|---|---:|---:|---:|---:|---:|\n")
              for item in sorted(rows, key=lambda value: value["seed"]):
                  handle.write(
                      f"| {item['seed']} | {item['id']} | {item.get('score','—')} | "
                      f"{item.get('new_passes','—')} | {item.get('regressions','—')} | "
                      f"{item.get('complete', False)} | {item.get('eligible', False)} |\n"
                  )
              if summary["winner"]:
                  winner = summary["winner"]
                  handle.write(
                      f"\n### Winner: seed {winner['seed']} — {winner['id']} "
                      f"({winner['score']}/500; +{winner['new_passes']}; 0 regressions)\n"
                  )
              elif not complete:
                  handle.write("\n**Tournament incomplete. No ranking or winner is valid.**\n")
              else:
                  handle.write("\n**No eligible winner.** All 30 candidates completed, but none met the gain and zero-regression gates.\n")
              handle.write("\nPromotion is manual; this workflow never merges candidates or changes the benchmark record.\n")
          if not complete:
              raise SystemExit(
                  f"Refusing to publish a complete 30-seed result: {len(incomplete)} candidate(s) lack verified full evidence"
              )
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: failure-tournament-final-${{ github.run_id }}
          path: failure-tournament-summary.json
          if-no-files-found: warn
          retention-days: 90
