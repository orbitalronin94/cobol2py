name: seven-candidate-tournament

run-name: Seven-candidate COBOL equivalence tournament

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "cobol2py.py"
      - "tests/test_cobol2py.py"
      - "web/index.html"
      - ".github/workflows/seven-candidate-tournament.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: cobol2py-seven-candidate-tournament-v3
  cancel-in-progress: false

# Reusable candidate tournament: run for PRs that touch translator/tests and on manual dispatch.
# Candidate results are reports only. Never auto-merge based on a tournament artifact.

jobs:
  candidate-tests:
    name: Tests — ${{ matrix.candidate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - { name: literal-condition, ref: experiment-v2/literal-condition }
          - { name: pic-numeric-boundaries, ref: experiment-v2/pic-numeric-boundaries }
          - { name: group-move-storage, ref: experiment-v2/group-move-storage }
          - { name: indexed-occurs-semantics, ref: experiment-v2/indexed-occurs-semantics }
          - { name: evaluate-branch-selection, ref: experiment-v2/evaluate-branch-selection }
          - { name: candidate-06, ref: experiment-v3/candidate-06 }
          - { name: candidate-07, ref: experiment-v3/candidate-07 }
          - { name: candidate-08, ref: experiment-v3/candidate-08 }
          - { name: candidate-09, ref: experiment-v3/candidate-09 }
          - { name: candidate-10, ref: experiment-v3/candidate-10 }
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full unit/regression suite
        id: unit-tests
        run: python -m unittest discover -s tests -v
      - name: Compile translator and benchmark runners
        id: compile
        run: python -m py_compile cobol2py.py cobol2native.py benchmarks/run_external_corpus.py benchmarks/run_external_multilang.py benchmarks/run_multilang_benchmark.py
      - name: Record candidate test result
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.ref }}
          OUTPUT: ${{ runner.temp }}/candidate-test-result.json
        run: |
          python - <<'PY'
          import json, os, subprocess
          try:
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          except Exception:
              sha = ""
          result = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sha": sha,
              "tests_passed": os.environ.get("UNIT_OUTCOME") == "success" and os.environ.get("COMPILE_OUTCOME") == "success",
              "unit_tests": os.environ.get("UNIT_OUTCOME"),
              "compile": os.environ.get("COMPILE_OUTCOME"),
          }
          with open(os.environ["OUTPUT"], "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY
      - name: Upload candidate test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-tests-${{ matrix.candidate.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-test-result.json
          if-no-files-found: warn
          retention-days: 30

  external-benchmark:
    name: Exact corpus — ${{ matrix.candidate.name }} / ${{ matrix.sample.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate:
          - { name: literal-condition, ref: experiment-v2/literal-condition }
          - { name: pic-numeric-boundaries, ref: experiment-v2/pic-numeric-boundaries }
          - { name: group-move-storage, ref: experiment-v2/group-move-storage }
          - { name: indexed-occurs-semantics, ref: experiment-v2/indexed-occurs-semantics }
          - { name: evaluate-branch-selection, ref: experiment-v2/evaluate-branch-selection }
          - { name: candidate-06, ref: experiment-v3/candidate-06 }
          - { name: candidate-07, ref: experiment-v3/candidate-07 }
          - { name: candidate-08, ref: experiment-v3/candidate-08 }
          - { name: candidate-09, ref: experiment-v3/candidate-09 }
          - { name: candidate-10, ref: experiment-v3/candidate-10 }
        sample:
          - { name: holdout, skip: 500 }
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate.ref }}
      - name: Download pinned X-COBOL v2 archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" --output /tmp/COBOL_Files.zip
          ls -lh /tmp/COBOL_Files.zip
      - name: Build isolated benchmark image
        run: docker build -f benchmarks/Dockerfile.external -t cobol2py-seven-candidate .
      - name: Prepare exact candidate/sample metadata
        env:
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.ref }}
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME"
          python - <<'PY'
          import json, os, subprocess
          meta = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sample": os.environ["SAMPLE_NAME"],
              "skip": int(os.environ["SKIP"]),
              "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          }
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-meta.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(meta, handle, indent=2)
          print(json.dumps(meta, indent=2))
          PY
      - name: Run reference-comparable 500-program sample
        id: run-benchmark
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: cobol2py-${{ github.run_id }}-${{ matrix.candidate.name }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          set +e
          docker run --name "$CONTAINER_NAME"             --network none             --cap-drop=ALL             --security-opt=no-new-privileges             --pids-limit=128             --memory=4g             --cpus=2             --read-only             --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g             --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"             --mount "type=bind,source=/tmp/COBOL_Files.zip,target=/input.zip,readonly"             --mount "type=bind,source=$OUTPUT_DIR,target=/output"             --workdir /workspace             cobol2py-seven-candidate             benchmarks/run_external_corpus.py             --translator /workspace/cobol2py.py             --archive /input.zip             --output "/output/$SAMPLE_NAME"             --target 500             --skip "$SKIP"             --diagnostics
          benchmark_status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true
          exit "$benchmark_status"
      - name: Record benchmark command outcome
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          BENCHMARK_OUTCOME: ${{ steps.run-benchmark.outcome }}
        run: |
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-run-status.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({"outcome": os.environ.get("BENCHMARK_OUTCOME")}, handle, indent=2)
          PY
      - name: Publish candidate scorecard
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
        run: |
          file="$OUTPUT_DIR/$SAMPLE_NAME/external-corpus-report.md"
          if [ -f "$file" ]; then
            echo "## $CANDIDATE_NAME — $SAMPLE_NAME" >> "$GITHUB_STEP_SUMMARY"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete report for $CANDIDATE_NAME / $SAMPLE_NAME." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload exact-match report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-benchmark-${{ matrix.candidate.name }}-${{ matrix.sample.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Holdout gate — 250/500 minimum
    if: always() && needs.external-benchmark.result != 'skipped'
    needs: [candidate-tests, external-benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Download candidate reports and test results
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-*-${{ github.run_id }}
          path: ${{ runner.temp }}/tournament-artifacts
          merge-multiple: false
      - name: Rank only the 500-program holdout and enforce 50 percent
        env:
          REPORT_ROOT: ${{ runner.temp }}/tournament-artifacts
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["REPORT_ROOT"])
          candidates = {
              "literal-condition": "experiment-v2/literal-condition",
              "pic-numeric-boundaries": "experiment-v2/pic-numeric-boundaries",
              "group-move-storage": "experiment-v2/group-move-storage",
              "indexed-occurs-semantics": "experiment-v2/indexed-occurs-semantics",
              "evaluate-branch-selection": "experiment-v2/evaluate-branch-selection",
              "candidate-06": "experiment-v3/candidate-06",
              "candidate-07": "experiment-v3/candidate-07",
              "candidate-08": "experiment-v3/candidate-08",
              "candidate-09": "experiment-v3/candidate-09",
              "candidate-10": "experiment-v3/candidate-10",
          }
          tests = {}
          for path in root.rglob("candidate-test-result.json"):
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
                  tests[item["candidate"]] = item
              except Exception as exc:
                  print(f"Reject invalid test result {path}: {exc}")

          scores = []
          for meta_path in root.rglob("candidate-meta.json"):
              try:
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  if meta.get("sample") != "holdout" or meta.get("skip") != 500:
                      print(f"Reject non-holdout artifact: {meta_path}")
                      continue
                  name = meta.get("candidate")
                  report_path = meta_path.parent / "external-corpus-report.json"
                  status_path = meta_path.parent / "candidate-run-status.json"
                  if name not in candidates or not report_path.is_file() or not status_path.is_file():
                      continue
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  status = json.loads(status_path.read_text(encoding="utf-8"))
                  result_rows = report.get("results", [])
                  ids = [row.get("id") for row in result_rows]
                  passed = sum(row.get("status") == "passed" for row in result_rows)
                  test = tests.get(name, {})
                  valid = (
                      status.get("outcome") == "success"
                      and meta.get("branch") == candidates[name]
                      and bool(meta.get("sha"))
                      and report.get("tested") == 500
                      and report.get("target") == 500
                      and report.get("skip") == 500
                      and report.get("sample_complete") is True
                      and report.get("archive_md5_verified") is True
                      and len(result_rows) == 500
                      and len(set(ids)) == 500
                      and passed == report.get("passed")
                      and test.get("sha") == meta.get("sha")
                      and test.get("tests_passed") is True
                  )
                  if not valid:
                      print(f"REJECTED {name}: incomplete, mismatched SHA, failed tests, or invalid holdout")
                      continue
                  scores.append((passed, name, meta["sha"]))
              except Exception as exc:
                  print(f"Reject invalid artifact {meta_path}: {exc}")

          scores.sort(reverse=True)
          lines = [
              "## Holdout-only tournament (the only selection metric)",
              "",
              "Threshold: **250/500 = 50.0%**. No primary score or 105-case differential score is used.",
              "",
              "| Rank | Candidate | Holdout passed / 500 | Percentage | SHA |",
              "|---:|---|---:|---:|---|",
          ]
          for rank, (passed, name, sha) in enumerate(scores, 1):
              lines.append(f"| {rank} | {name} | {passed}/500 | {passed/5:.1f}% | `{sha[:12]}` |")
          winners = [row for row in scores if row[0] >= 250]
          if winners:
              lines += ["", f"**Threshold met:** {winners[0][1]} — {winners[0][0]}/500 ({winners[0][0]/5:.1f}%). Manual review required; no automatic merge."]
          else:
              best = f"{scores[0][1]} at {scores[0][0]}/500 ({scores[0][0]/5:.1f}%)" if scores else "no valid candidate result"
              lines += ["", f"**No winner:** none reached 250/500. Current best: {best}. Depuration is required before another run; this workflow does not pretend repeated execution of unchanged code is improvement."]
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          if not winners:
              raise SystemExit("No candidate reached the required holdout threshold of 250/500.")
          PY
