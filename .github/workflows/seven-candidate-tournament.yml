name: seven-candidate-tournament

run-name: Seven-candidate COBOL equivalence tournament

on:
  push:
    branches: [main]
    paths:
      - "cobol2py.py"
      - "tests/test_cobol2py.py"
      - "web/index.html"
      - ".github/workflows/seven-candidate-tournament.yml"
      - "benchmarks/holdout-record.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # Isolate each PR's tournament. A shared group silently cancels queued candidates.
  group: cobol2py-seven-candidate-tournament-${{ github.ref }}
  cancel-in-progress: true

# One coordinator only: run on main workflow updates or explicit workflow_dispatch, never once per candidate PR.
# Candidate scores are advisory until the exact SHA, complete holdout, and open PR are revalidated by the promotion job.

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.list.outputs.candidates }}
    steps:
      - name: Discover open, non-draft experiment PRs and freeze their SHAs
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '[.[] | select(.base.ref == "main" and .draft == false and (.head.ref | test("^experiment(-v2|-v3)?/"))) | {name:(.head.ref | gsub("/"; "-")), branch:.head.ref, sha:.head.sha, pr:.number}] | unique_by(.branch)')
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
          echo "$candidates" | jq .

  candidate-tests:
    needs: discover
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.discover.outputs.candidates != '[]'
    name: Tests — ${{ matrix.candidate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full unit/regression suite
        id: unit-tests
        run: python -m unittest discover -s tests -v
      - name: Compile translator and benchmark runners
        id: compile
        run: python -m py_compile cobol2py.py cobol2native.py benchmarks/run_external_corpus.py benchmarks/run_external_multilang.py benchmarks/run_multilang_benchmark.py
      - name: Record candidate test result
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.branch }}
          OUTPUT: ${{ runner.temp }}/candidate-test-result.json
        run: |
          python - <<'PY'
          import json, os, subprocess
          try:
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          except Exception:
              sha = ""
          result = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sha": sha,
              "tests_passed": os.environ.get("UNIT_OUTCOME") == "success" and os.environ.get("COMPILE_OUTCOME") == "success",
              "unit_tests": os.environ.get("UNIT_OUTCOME"),
              "compile": os.environ.get("COMPILE_OUTCOME"),
          }
          with open(os.environ["OUTPUT"], "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY
      - name: Upload candidate test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-tests-${{ matrix.candidate.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-test-result.json
          if-no-files-found: warn
          retention-days: 30

  external-benchmark:
    needs: discover
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.number == 239) && needs.discover.outputs.candidates != '[]'
    name: Exact corpus — ${{ matrix.candidate.name }} / ${{ matrix.sample.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
        sample:
          - { name: holdout, skip: 500 }
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate.sha }}
      - name: Download pinned X-COBOL v2 archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" --output /tmp/COBOL_Files.zip
          ls -lh /tmp/COBOL_Files.zip
      - name: Build isolated benchmark image
        run: docker build -f benchmarks/Dockerfile.external -t cobol2py-seven-candidate .
      - name: Prepare exact candidate/sample metadata
        env:
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.branch }}
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME"
          python - <<'PY'
          import json, os, subprocess
          meta = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sample": os.environ["SAMPLE_NAME"],
              "skip": int(os.environ["SKIP"]),
              "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          }
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-meta.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(meta, handle, indent=2)
          print(json.dumps(meta, indent=2))
          PY
      - name: Run reference-comparable 500-program sample
        id: run-benchmark
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: cobol2py-${{ github.run_id }}-${{ matrix.candidate.name }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          set +e
          docker run --name "$CONTAINER_NAME"             --network none             --cap-drop=ALL             --security-opt=no-new-privileges             --pids-limit=128             --memory=4g             --cpus=2             --read-only             --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g             --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"             --mount "type=bind,source=/tmp/COBOL_Files.zip,target=/input.zip,readonly"             --mount "type=bind,source=$OUTPUT_DIR,target=/output"             --workdir /workspace             cobol2py-seven-candidate             benchmarks/run_external_corpus.py             --translator /workspace/cobol2py.py             --archive /input.zip             --output "/output/$SAMPLE_NAME"             --target 500             --skip "$SKIP"             --diagnostics
          benchmark_status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true
          exit "$benchmark_status"
      - name: Record benchmark command outcome
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          BENCHMARK_OUTCOME: ${{ steps.run-benchmark.outcome }}
        run: |
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-run-status.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({"outcome": os.environ.get("BENCHMARK_OUTCOME")}, handle, indent=2)
          PY
      - name: Publish candidate benchmark report
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
        run: |
          file="$OUTPUT_DIR/$SAMPLE_NAME/external-corpus-report.md"
          if [ -f "$file" ]; then
            echo "## $CANDIDATE_NAME — $SAMPLE_NAME" >> "$GITHUB_STEP_SUMMARY"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete report for $CANDIDATE_NAME / $SAMPLE_NAME." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload exact-match report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-benchmark-${{ matrix.candidate.name }}-${{ matrix.sample.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Verified holdout ranking
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.external-benchmark.result != 'skipped'
    needs: [discover, candidate-tests, external-benchmark]
    outputs:
      winner: ${{ steps.score.outputs.winner }}
      winner_branch: ${{ steps.score.outputs.winner_branch }}
      winner_sha: ${{ steps.score.outputs.winner_sha }}
      winner_score: ${{ steps.score.outputs.winner_score }}
    runs-on: ubuntu-latest
    steps:
      - name: Read current verified record from main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download candidate reports and test results
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-*-${{ github.run_id }}
          path: ${{ runner.temp }}/tournament-artifacts
          merge-multiple: false
      - name: Rank complete holdout results against the persisted record
        id: score
        env:
          REPORT_ROOT: ${{ runner.temp }}/tournament-artifacts
          CANDIDATES_JSON: ${{ needs.discover.outputs.candidates }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["REPORT_ROOT"])
          candidate_rows = json.loads(os.environ["CANDIDATES_JSON"])
          candidates = {item["name"]: item for item in candidate_rows}
          record = json.loads(Path("benchmarks/holdout-record.json").read_text(encoding="utf-8"))
          baseline = int(record.get("passed", 240))
          print(f"Verified record: {baseline}/500 ({baseline/5:.1f}%)")
          tests = {}
          for path in root.rglob("candidate-test-result.json"):
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
                  tests[item["candidate"]] = item
              except Exception as exc:
                  print(f"Reject invalid test result {path}: {exc}")

          scores = []
          for meta_path in root.rglob("candidate-meta.json"):
              try:
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  if meta.get("sample") != "holdout" or meta.get("skip") != 500:
                      print(f"Reject non-holdout artifact: {meta_path}")
                      continue
                  name = meta.get("candidate")
                  report_path = meta_path.parent / "external-corpus-report.json"
                  status_path = meta_path.parent / "candidate-run-status.json"
                  if name not in candidates or not report_path.is_file() or not status_path.is_file():
                      continue
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  status = json.loads(status_path.read_text(encoding="utf-8"))
                  result_rows = report.get("results", [])
                  ids = [row.get("id") for row in result_rows]
                  passed = sum(row.get("status") == "passed" for row in result_rows)
                  test = tests.get(name, {})
                  valid = (
                      status.get("outcome") == "success"
                      and name in candidates
                      and meta.get("branch") == candidates[name]["branch"]
                      and meta.get("sha") == candidates[name]["sha"]
                      and report.get("tested") == 500
                      and report.get("target") == 500
                      and report.get("skip") == 500
                      and report.get("sample_complete") is True
                      and report.get("archive_md5_verified") is True
                      and len(result_rows) == 500
                      and len(set(ids)) == 500
                      and passed == report.get("passed")
                      and test.get("sha") == meta.get("sha")
                      and test.get("tests_passed") is True
                  )
                  if not valid:
                      print(f"REJECTED {name}: incomplete, mismatched SHA, failed tests, or invalid holdout")
                      continue
                  scores.append((passed, name, meta["sha"]))
              except Exception as exc:
                  print(f"Reject invalid artifact {meta_path}: {exc}")

          scores.sort(reverse=True)
          lines = [
              "## Holdout-only tournament (the only selection metric)",
              "",
              f"Persisted record: **{baseline}/500 ({baseline/5:.1f}%)**. A candidate must strictly beat it; no primary score or differential score is used.",
              "",
              "| Rank | Candidate | Holdout passed / 500 | Percentage | SHA |",
              "|---:|---|---:|---:|---|",
          ]
          for rank, (passed, name, sha) in enumerate(scores, 1):
              lines.append(f"| {rank} | {name} | {passed}/500 | {passed/5:.1f}% | `{sha[:12]}` |")
          winners = [row for row in scores if row[0] > baseline]
          output = {"winner":"false","winner_branch":"","winner_sha":"","winner_score":"0","winner_name":""}
          if winners:
              passed, name, sha = winners[0]
              output = {"winner":"true","winner_branch":candidates[name]["branch"],"winner_sha":sha,"winner_score":str(passed),"winner_name":name}
              lines += ["", f"**Record breaker:** {name} — {passed}/500 ({passed/5:.1f}%), strictly above {baseline}/500. Exact PR/head SHA will be revalidated before merge."]
          else:
              best = f"{scores[0][1]} at {scores[0][0]}/500 ({scores[0][0]/5:.1f}%)" if scores else "no valid candidate result"
              lines += ["", f"**No promotion:** no candidate strictly beat {baseline}/500. Current best: {best}."]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

  promote-record-breaker:
    name: Merge verified record-breaker and launch next round
    if: needs.aggregate.outputs.winner == 'true'
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main with write token
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - name: Revalidate exact open PR and merge SHA-guarded
        env:
          GH_TOKEN: ${{ github.token }}
          WINNER_BRANCH: ${{ needs.aggregate.outputs.winner_branch }}
          WINNER_SHA: ${{ needs.aggregate.outputs.winner_sha }}
          WINNER_SCORE: ${{ needs.aggregate.outputs.winner_score }}
        run: |
          set -euo pipefail
          encoded=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["WINNER_BRANCH"], safe=""))')
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$encoded" --jq .commit.sha)
          test "$branch_sha" = "$WINNER_SHA" || { echo "Winner SHA changed; refusing promotion."; exit 1; }
          prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")
          pr_number=$(echo "$prs" | jq -r --arg branch "$WINNER_BRANCH" --arg sha "$WINNER_SHA" '[.[] | select(.base.ref=="main" and .head.ref==$branch and .head.sha==$sha and .draft==false)] | .[0].number // empty')
          test -n "$pr_number" || { echo "No open, non-draft PR matches the exact scored SHA."; exit 1; }
          result=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" -f merge_method=squash -f sha="$WINNER_SHA")
          echo "$result" | jq -e '.merged == true'
          echo "Merged PR #$pr_number at $WINNER_SCORE/500."
      - name: Persist new verified record
        env:
          GH_TOKEN: ${{ github.token }}
          WINNER_BRANCH: ${{ needs.aggregate.outputs.winner_branch }}
          WINNER_SHA: ${{ needs.aggregate.outputs.winner_sha }}
          WINNER_SCORE: ${{ needs.aggregate.outputs.winner_score }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = "benchmarks/holdout-record.json"
          data = {
              "benchmark": "external-cobol-corpus",
              "sample": "holdout",
              "tested": 500,
              "passed": int(os.environ["WINNER_SCORE"]),
              "percentage": int(os.environ["WINNER_SCORE"]) / 5,
              "candidate_branch": os.environ["WINNER_BRANCH"],
              "candidate_sha": os.environ["WINNER_SHA"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "note": "Updated only by the SHA-guarded promotion workflow after a complete verified 500-program holdout."
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/holdout-record.json
          git commit -m "benchmarks: record verified holdout record"
          git push origin main
      - name: Rebase remaining candidates on promoted main
        env:
          GH_TOKEN: ${{ github.token }}
          WINNER_BRANCH: ${{ needs.aggregate.outputs.winner_branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")
          echo "$prs" | jq -r --arg winner "$WINNER_BRANCH" '.[] | select(.base.ref=="main" and .draft==false and .head.ref!=$winner and (.head.ref|test("^experiment(-v2|-v3)?/"))) | [.number,.head.ref] | @tsv' |
          while IFS="$(printf '\t')" read -r number branch; do
            [ -n "$branch" ] || continue
            echo "Refreshing PR #$number ($branch) against main"
            git fetch origin "$branch"
            git checkout -B refresh-candidate "origin/$branch"
            if git merge --no-edit origin/main; then
              git push origin HEAD:"$branch"
            else
              git merge --abort || true
              node_id=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .node_id)
              gh api graphql -f query='mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' -F id="$node_id" || true
              echo "Marked conflicting PR #$number as draft so it is excluded from the next tournament."
            fi
          done
      - name: Dispatch next tournament against the new main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/seven-candidate-tournament.yml/dispatches" -f ref=main
