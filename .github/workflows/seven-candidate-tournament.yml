name: massive-parallel-tournament

run-name: COBOL equivalence tournament — ${{ inputs.cohort_size || '16' }} candidates

on:
  push:
    branches: [main]
    paths:
      - "cobol2py.py"
      - "tests/test_cobol2py.py"
      - "tests/test_tournament_workflow.py"
      - "experiments/massive-cohorts/16/manifest.json"
      - "web/index.html"
      - ".github/workflows/seven-candidate-tournament.yml"
      - "benchmarks/holdout-record.json"
  workflow_dispatch:
    inputs:
      cohort_size:
        description: "Number of experiment PRs to evaluate in this cohort"
        required: true
        type: choice
        options: ["16", "32", "64", "100"]
        default: "16"

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Isolate each PR's tournament. A shared group silently cancels queued candidates.
  group: cobol2py-massive-parallel-tournament-${{ github.ref }}
  cancel-in-progress: true

# One coordinator only: run on main workflow updates or explicit workflow_dispatch, never once per candidate PR.
# Freeze candidate SHAs, then measure both disjoint 500-case samples for main and every candidate.
# Ranking requires complete paired exact-match results, green tests, and zero regressions by case ID.
# This workflow publishes evidence only; it never merges candidates or changes the benchmark record.

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.list.outputs.candidates }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Discover manifest-backed experiment PRs and freeze their SHAs
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" | jq -s 'add' > "$RUNNER_TEMP/open-pulls.json"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            batch_size="${{ inputs.cohort_size || '16' }}"
            case "$batch_size" in
              16|32|64|100) ;;
              *) echo "Unsupported cohort size: $batch_size" >&2; exit 1 ;;
            esac
          else
            batch_size="16"
          fi
          if [ "$batch_size" = "16" ]; then
            candidates=$(jq -cn --arg main_sha "$main_sha" --slurpfile pulls "$RUNNER_TEMP/open-pulls.json" --slurpfile manifest experiments/massive-cohorts/16/manifest.json '
              ($manifest[0].candidates | map(select(.merged != true) | .branch)) as $branches |
              ([$pulls[0][] as $p |
                select($p.base.ref == "main" and $p.draft == false and (($branches | index($p.head.ref)) != null)) |
                {name:($p.head.ref | gsub("/"; "-")), branch:$p.head.ref, sha:$p.head.sha, pr:$p.number}
              ] | sort_by(.branch)) as $selected |
              if ($selected | length) != ($branches | length) then
                error("Expected all " + (($branches | length)|tostring) + " unmerged manifest candidates as open PRs; found " + ($selected|length|tostring))
              else
                [{name:"main-baseline",branch:"main",sha:$main_sha,pr:0}, {name:"previous-main-baseline",branch:"main-before-pr322",sha:"b63304e430ca45fa3d96910c2a867ef4aeb37a27",pr:0}] + $selected
              end')
          else
            prefix="experiment-massive-${batch_size}/"
            candidates=$(jq -cn --arg main_sha "$main_sha" --arg prefix "$prefix" --argjson n "$batch_size" --slurpfile pulls "$RUNNER_TEMP/open-pulls.json" '
              ([$pulls[0][] | select(.base.ref == "main" and .draft == false and (.head.ref | startswith($prefix))) |
                {name:(.head.ref | gsub("/"; "-")), branch:.head.ref, sha:.head.sha, pr:.number}] |
                unique_by(.branch) | sort_by(.branch) | .[0:$n]) as $selected |
              if ($selected | length) != $n then
                error("Expected exactly " + ($n|tostring) + " open non-draft candidate PRs under " + $prefix + "; found " + ($selected|length|tostring))
              else
                [{name:"main-baseline",branch:"main",sha:$main_sha,pr:0}] + $selected
              end')
          fi
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
          echo "$candidates" | jq .

  candidate-tests:
    needs: discover
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.discover.outputs.candidates != '[]'
    name: Tests — ${{ matrix.candidate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.candidate.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run full unit/regression suite
        id: unit-tests
        run: python -m unittest discover -s tests -v
      - name: Compile translator and benchmark runners
        id: compile
        run: python -m py_compile cobol2py.py cobol2native.py benchmarks/run_external_corpus.py benchmarks/run_external_multilang.py benchmarks/run_multilang_benchmark.py
      - name: Record candidate test result
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.branch }}
          OUTPUT: ${{ runner.temp }}/candidate-test-result.json
        run: |
          python - <<'PY'
          import json, os, subprocess
          try:
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          except Exception:
              sha = ""
          result = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sha": sha,
              "tests_passed": os.environ.get("UNIT_OUTCOME") == "success" and os.environ.get("COMPILE_OUTCOME") == "success",
              "unit_tests": os.environ.get("UNIT_OUTCOME"),
              "compile": os.environ.get("COMPILE_OUTCOME"),
          }
          with open(os.environ["OUTPUT"], "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY
      - name: Upload candidate test status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-tests-${{ matrix.candidate.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-test-result.json
          if-no-files-found: warn
          retention-days: 30

  external-benchmark:
    needs: discover
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.number == 239) && needs.discover.outputs.candidates != '[]'
    name: Exact corpus — ${{ matrix.candidate.name }} / ${{ matrix.sample.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
        sample:
          - { name: primary, skip: 0 }
          - { name: holdout, skip: 500 }
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.candidate.sha }}
      - name: Download pinned X-COBOL v2 archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" --output /tmp/COBOL_Files.zip
          ls -lh /tmp/COBOL_Files.zip
      - name: Build isolated benchmark image
        run: docker build -f benchmarks/Dockerfile.external -t cobol2py-seven-candidate .
      - name: Prepare exact candidate/sample metadata
        env:
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.branch }}
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME"
          python - <<'PY'
          import json, os, subprocess
          meta = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sample": os.environ["SAMPLE_NAME"],
              "skip": int(os.environ["SKIP"]),
              "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          }
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-meta.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(meta, handle, indent=2)
          print(json.dumps(meta, indent=2))
          PY
      - name: Run reference-comparable 500-program sample
        id: run-benchmark
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: cobol2py-${{ github.run_id }}-${{ matrix.candidate.name }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          set +e
          docker run --name "$CONTAINER_NAME"             --network none             --cap-drop=ALL             --security-opt=no-new-privileges             --pids-limit=128             --memory=4g             --cpus=2             --read-only             --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g             --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"             --mount "type=bind,source=/tmp/COBOL_Files.zip,target=/input.zip,readonly"             --mount "type=bind,source=$OUTPUT_DIR,target=/output"             --workdir /workspace             cobol2py-seven-candidate             benchmarks/run_external_corpus.py             --translator /workspace/cobol2py.py             --archive /input.zip             --output "/output/$SAMPLE_NAME"             --target 500             --skip "$SKIP"
          benchmark_status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true
          exit "$benchmark_status"
      - name: Record benchmark command outcome
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          BENCHMARK_OUTCOME: ${{ steps.run-benchmark.outcome }}
        run: |
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-run-status.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({"outcome": os.environ.get("BENCHMARK_OUTCOME")}, handle, indent=2)
          PY
      - name: Publish candidate benchmark report
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
        run: |
          file="$OUTPUT_DIR/$SAMPLE_NAME/external-corpus-report.md"
          if [ -f "$file" ]; then
            echo "## $CANDIDATE_NAME — $SAMPLE_NAME" >> "$GITHUB_STEP_SUMMARY"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete report for $CANDIDATE_NAME / $SAMPLE_NAME." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload exact-match report and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-benchmark-${{ matrix.candidate.name }}-${{ matrix.sample.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Verified paired ranking
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.external-benchmark.result != 'skipped'
    needs: [discover, candidate-tests, external-benchmark]
    outputs:
      winner: ${{ steps.score.outputs.winner }}
      winner_branch: ${{ steps.score.outputs.winner_branch }}
      winner_sha: ${{ steps.score.outputs.winner_sha }}
      winner_score: ${{ steps.score.outputs.winner_score }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Read current verified record from main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Download candidate reports and test results
        uses: actions/download-artifact@v7
        with:
          pattern: candidate-*-${{ github.run_id }}
          path: ${{ runner.temp }}/tournament-artifacts
          merge-multiple: false
      - name: Rank complete paired results against main with zero regressions
        id: score
        env:
          REPORT_ROOT: ${{ runner.temp }}/tournament-artifacts
          CANDIDATES_JSON: ${{ needs.discover.outputs.candidates }}
          REPORT_FILE: ${{ runner.temp }}/massive-tournament-report.md
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          
          root = Path(os.environ["REPORT_ROOT"])
          candidates = {item["name"]: item for item in json.loads(os.environ["CANDIDATES_JSON"])}
          required_samples = ("primary", "holdout")
          expected_skip = {"primary": 0, "holdout": 500}
          tests = {}
          reports = {}
          rejected = {}
          
          for path in root.rglob("candidate-test-result.json"):
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
                  tests[item["candidate"]] = item
              except Exception as exc:
                  print(f"Reject invalid test result {path}: {exc}")
          
          for meta_path in root.rglob("candidate-meta.json"):
              try:
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  name = meta.get("candidate")
                  sample = meta.get("sample")
                  if name not in candidates or sample not in expected_skip:
                      continue
                  if meta.get("skip") != expected_skip[sample]:
                      rejected.setdefault(name, []).append(f"{sample}: unexpected skip")
                      continue
                  report_path = meta_path.parent / "external-corpus-report.json"
                  status_path = meta_path.parent / "candidate-run-status.json"
                  if not report_path.is_file() or not status_path.is_file():
                      rejected.setdefault(name, []).append(f"{sample}: missing report/status")
                      continue
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  status = json.loads(status_path.read_text(encoding="utf-8"))
                  rows = report.get("results", [])
                  ids = [row.get("id") for row in rows]
                  passed = sum(row.get("status") == "passed" for row in rows)
                  test = tests.get(name, {})
                  valid = (
                      status.get("outcome") == "success"
                      and meta.get("branch") == candidates[name]["branch"]
                      and meta.get("sha") == candidates[name]["sha"]
                      and report.get("tested") == 500
                      and report.get("target") == 500
                      and report.get("skip") == expected_skip[sample]
                      and report.get("sample_complete") is True
                      and report.get("archive_md5_verified") is True
                      and len(rows) == 500
                      and len(set(ids)) == 500
                      and all(isinstance(case_id, str) and case_id for case_id in ids)
                      and passed == report.get("passed")
                      and test.get("sha") == meta.get("sha")
                      and test.get("tests_passed") is True
                  )
                  if not valid:
                      rejected.setdefault(name, []).append(f"{sample}: incomplete, checksum/SHA mismatch, or failed tests")
                      continue
                  sample_reports = reports.setdefault(name, {})
                  if sample in sample_reports:
                      rejected.setdefault(name, []).append(f"{sample}: duplicate report")
                      sample_reports.pop(sample, None)
                      continue
                  sample_reports[sample] = {
                      row["id"]: row.get("status") == "passed"
                      for row in rows
                  }
              except Exception as exc:
                  print(f"Reject invalid artifact {meta_path}: {exc}")
          
          baseline_reports = reports.get("main-baseline", {})
          if set(baseline_reports) != set(required_samples):
              raise SystemExit("Cannot rank candidates: main baseline lacks complete primary and holdout reports.")
          
          baseline = baseline_reports
          primary_ids = set(baseline["primary"])
          holdout_ids = set(baseline["holdout"])
          if primary_ids & holdout_ids:
              raise SystemExit("Invalid corpus split: primary and holdout IDs overlap.")
          
          baseline_primary = sum(baseline["primary"].values())
          baseline_holdout = sum(baseline["holdout"].values())
          baseline_total = baseline_primary + baseline_holdout
          print(
              f"Same-run main baseline: primary {baseline_primary}/500, "
              f"holdout {baseline_holdout}/500, combined {baseline_total}/1000 "
              f"({baseline_total/10:.1f}%)."
          )
          
          scores = []
          for name, candidate in candidates.items():
              if name == "main-baseline":
                  continue
              test = tests.get(name, {})
              if test.get("sha") != candidate["sha"] or test.get("tests_passed") is not True:
                  rejected.setdefault(name, []).append("full unit/compile suite did not pass on frozen SHA")
                  continue
              outcomes = reports.get(name, {})
              if set(outcomes) != set(required_samples):
                  missing = sorted(set(required_samples) - set(outcomes))
                  rejected.setdefault(name, []).append("missing complete sample(s): " + ", ".join(missing))
                  continue
          
              gains = 0
              regressions = 0
              case_set_matches = True
              for sample in required_samples:
                  if set(outcomes[sample]) != set(baseline[sample]):
                      rejected.setdefault(name, []).append(f"{sample}: case ID set differs from main")
                      case_set_matches = False
                      break
                  for case_id, baseline_passed in baseline[sample].items():
                      candidate_passed = outcomes[sample][case_id]
                      if candidate_passed and not baseline_passed:
                          gains += 1
                      elif baseline_passed and not candidate_passed:
                          regressions += 1
              if not case_set_matches:
                  continue
              primary_passed = sum(outcomes["primary"].values())
              holdout_passed = sum(outcomes["holdout"].values())
              combined = primary_passed + holdout_passed
              scores.append({
                  "name": name,
                  "sha": candidate["sha"],
                  "primary": primary_passed,
                  "holdout": holdout_passed,
                  "combined": combined,
                  "gains": gains,
                  "regressions": regressions,
              })
          
          scores.sort(key=lambda row: (-row["combined"], row["regressions"], -row["gains"], row["name"]))
          qualified = [
              row for row in scores
              if row["combined"] > baseline_total and row["gains"] > 0 and row["regressions"] == 0
          ]
          
          lines = [
              "## Paired exact-match tournament — no automatic promotion",
              "",
              f"Same-run main baseline: primary **{baseline_primary}/500 ({baseline_primary/5:.1f}%)**, "
              f"holdout **{baseline_holdout}/500 ({baseline_holdout/5:.1f}%)**, "
              f"combined **{baseline_total}/1000 ({baseline_total/10:.1f}%)**.",
              "A candidate qualifies for human review only with both complete 500-case samples on the frozen SHA, "
              "green full tests, a higher combined score, and **zero regressions by case ID across all 1,000 cases**.",
              "",
              "| Rank | Candidate | Primary | Holdout | Combined | Gains | Regressions | SHA |",
              "|---:|---|---:|---:|---:|---:|---:|---|",
          ]
          for rank, row in enumerate(scores, 1):
              lines.append(
                  f"| {rank} | {row['name']} | {row['primary']}/500 ({row['primary']/5:.1f}%) "
                  f"| {row['holdout']}/500 ({row['holdout']/5:.1f}%) "
                  f"| **{row['combined']}/1000 ({row['combined']/10:.1f}%)** "
                  f"| {row['gains']} | {row['regressions']} | {row['sha'][:12]} |"
              )
          if qualified:
              lines += [
                  "",
                  "**Qualified for human review only:** " + ", ".join(row["name"] for row in qualified) + ".",
                  "No PR is merged and the benchmark record is not changed by this workflow.",
              ]
          else:
              lines += [
                  "",
                  "**No candidate qualifies.** No merge and no benchmark-record update.",
              ]
          if rejected:
              lines += ["", "### Rejected candidates"]
              for name in sorted(rejected):
                  lines.append(f"- {name}: " + "; ".join(sorted(set(rejected[name]))))
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          Path(os.environ["REPORT_FILE"]).write_text(summary, encoding="utf-8")
          print(summary)
          PY
      - name: Append verified run report to the experiment protocol
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/massive-tournament-report.md
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          COHORT_SIZE: ${{ inputs.cohort_size || '16' }}
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT_FILE" ]; then
            echo "No verified ranking report was produced; document was not updated."
            exit 0
          fi
          doc="docs/MASSIVE_PARALLEL_EXPERIMENT_PROTOCOL.md"
          if [ ! -f "$doc" ]; then
            echo "Protocol document is not present on main yet; merge PR #315 before running this workflow."
            exit 0
          fi
          {
            printf '\n\n---\n\n## Ejecución automática #%s (run %s)\n\n' "$RUN_NUMBER" "$RUN_ID"
            printf -- '- Evento: `%s`\n- Tamaño solicitado: `%s` candidatas (más baseline main)\n- Informe: https://github.com/%s/actions/runs/%s\n\n' "$EVENT_NAME" "$COHORT_SIZE" "$GITHUB_REPOSITORY" "$RUN_ID"
            cat "$REPORT_FILE"
          } >> "$doc"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$doc"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "docs: record massive tournament run #$RUN_NUMBER"
            git push origin HEAD:main
          fi

