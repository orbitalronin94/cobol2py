name: massive-parallel-tournament

run-name: COBOL equivalence tournament — ${{ inputs.cohort_size || 'auto' }} candidates

on:
  push:
    branches: [main]
    paths:
      - "cobol2py.py"
      - "tests/test_cobol2py.py"
      - "web/index.html"
      - ".github/workflows/seven-candidate-tournament.yml"
      - "benchmarks/holdout-record.json"
  workflow_dispatch:
    inputs:
      cohort_size:
        description: "Number of experiment PRs to evaluate in this cohort"
        required: true
        type: choice
        options: ["16", "32", "64", "100"]
        default: "16"

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Isolate each PR's tournament. A shared group silently cancels queued candidates.
  group: cobol2py-massive-parallel-tournament-${{ github.ref }}
  cancel-in-progress: true

# One coordinator only: run on main workflow updates or explicit workflow_dispatch, never once per candidate PR.
# Candidate PRs are refreshed against main; only the unchanged external holdout (skip=500, 500 cases) decides ranking.
# Candidate scores are advisory: this workflow measures frozen PR SHAs and never merges candidates automatically.
# Re-run the coordinator after candidate branch updates; primary-sample scoring is intentionally disabled.

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.list.outputs.candidates }}
    steps:
      - name: Discover open, non-draft experiment PRs and freeze their SHAs
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          pulls=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" | jq -s 'add')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            batch_size="${{ inputs.cohort_size }}"
            prefix="experiment-massive-${batch_size}/"
            candidates=$(jq --arg main_sha "$main_sha" --arg prefix "$prefix" --argjson n "$batch_size" '
              ([.[] | select(.base.ref == "main" and .draft == false and (.head.ref | startswith($prefix))) |
                {name:(.head.ref | gsub("/"; "-")), branch:.head.ref, sha:.head.sha, pr:.number}] |
                unique_by(.branch) | sort_by(.branch) | .[0:$n]) as $selected |
              if ($selected | length) != $n then
                error("Expected exactly " + ($n|tostring) + " open non-draft candidate PRs under " + $prefix + "; found " + ($selected|length|tostring))
              else
                [{name:"main-baseline",branch:"main",sha:$main_sha,pr:0}] + $selected
              end' <<< "$pulls")
          else
            candidates=$(jq --arg main_sha "$main_sha" '
              [{name:"main-baseline",branch:"main",sha:$main_sha,pr:0}] +
              ([.[] | select(.base.ref == "main" and .draft == false and (.head.ref | test("^experiment(-v2|-v3|-v4)?/"))) |
                {name:(.head.ref | gsub("/"; "-")), branch:.head.ref, sha:.head.sha, pr:.number}] | unique_by(.branch))' <<< "$pulls")
          fi
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
          echo "$candidates" | jq .

  candidate-tests:
    needs: discover
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.discover.outputs.candidates != '[]'
    name: Tests — ${{ matrix.candidate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.candidate.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run full unit/regression suite
        id: unit-tests
        run: python -m unittest discover -s tests -v
      - name: Compile translator and benchmark runners
        id: compile
        run: python -m py_compile cobol2py.py cobol2native.py benchmarks/run_external_corpus.py benchmarks/run_external_multilang.py benchmarks/run_multilang_benchmark.py
      - name: Record candidate test result
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.branch }}
          OUTPUT: ${{ runner.temp }}/candidate-test-result.json
        run: |
          python - <<'PY'
          import json, os, subprocess
          try:
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          except Exception:
              sha = ""
          result = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sha": sha,
              "tests_passed": os.environ.get("UNIT_OUTCOME") == "success" and os.environ.get("COMPILE_OUTCOME") == "success",
              "unit_tests": os.environ.get("UNIT_OUTCOME"),
              "compile": os.environ.get("COMPILE_OUTCOME"),
          }
          with open(os.environ["OUTPUT"], "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY
      - name: Upload candidate test status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-tests-${{ matrix.candidate.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-test-result.json
          if-no-files-found: warn
          retention-days: 30

  external-benchmark:
    needs: discover
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.number == 239) && needs.discover.outputs.candidates != '[]'
    name: Exact corpus — ${{ matrix.candidate.name }} / ${{ matrix.sample.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.candidates) }}
        sample:
          - { name: holdout, skip: 500 }
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.candidate.sha }}
      - name: Download pinned X-COBOL v2 archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://zenodo.org/records/14269462/files/COBOL_Files.zip?download=1" --output /tmp/COBOL_Files.zip
          ls -lh /tmp/COBOL_Files.zip
      - name: Build isolated benchmark image
        run: docker build -f benchmarks/Dockerfile.external -t cobol2py-seven-candidate .
      - name: Prepare exact candidate/sample metadata
        env:
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
          CANDIDATE_REF: ${{ matrix.candidate.branch }}
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
        run: |
          mkdir -p "$OUTPUT_DIR/$SAMPLE_NAME"
          chmod 0777 "$OUTPUT_DIR" "$OUTPUT_DIR/$SAMPLE_NAME"
          python - <<'PY'
          import json, os, subprocess
          meta = {
              "candidate": os.environ["CANDIDATE_NAME"],
              "branch": os.environ["CANDIDATE_REF"],
              "sample": os.environ["SAMPLE_NAME"],
              "skip": int(os.environ["SKIP"]),
              "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          }
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-meta.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(meta, handle, indent=2)
          print(json.dumps(meta, indent=2))
          PY
      - name: Run reference-comparable 500-program sample
        id: run-benchmark
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          SKIP: ${{ matrix.sample.skip }}
          CONTAINER_NAME: cobol2py-${{ github.run_id }}-${{ matrix.candidate.name }}-${{ matrix.sample.name }}
        shell: bash
        run: |
          set +e
          docker run --name "$CONTAINER_NAME"             --network none             --cap-drop=ALL             --security-opt=no-new-privileges             --pids-limit=128             --memory=4g             --cpus=2             --read-only             --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g             --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"             --mount "type=bind,source=/tmp/COBOL_Files.zip,target=/input.zip,readonly"             --mount "type=bind,source=$OUTPUT_DIR,target=/output"             --workdir /workspace             cobol2py-seven-candidate             benchmarks/run_external_corpus.py             --translator /workspace/cobol2py.py             --archive /input.zip             --output "/output/$SAMPLE_NAME"             --target 500             --skip "$SKIP"             --diagnostics
          benchmark_status=$?
          docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true
          exit "$benchmark_status"
      - name: Record benchmark command outcome
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          BENCHMARK_OUTCOME: ${{ steps.run-benchmark.outcome }}
        run: |
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["OUTPUT_DIR"], os.environ["SAMPLE_NAME"], "candidate-run-status.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({"outcome": os.environ.get("BENCHMARK_OUTCOME")}, handle, indent=2)
          PY
      - name: Publish candidate benchmark report
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/candidate-artifacts
          SAMPLE_NAME: ${{ matrix.sample.name }}
          CANDIDATE_NAME: ${{ matrix.candidate.name }}
        run: |
          file="$OUTPUT_DIR/$SAMPLE_NAME/external-corpus-report.md"
          if [ -f "$file" ]; then
            echo "## $CANDIDATE_NAME — $SAMPLE_NAME" >> "$GITHUB_STEP_SUMMARY"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete report for $CANDIDATE_NAME / $SAMPLE_NAME." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload exact-match report and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-benchmark-${{ matrix.candidate.name }}-${{ matrix.sample.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-artifacts/${{ matrix.sample.name }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Verified holdout ranking
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.external-benchmark.result != 'skipped'
    needs: [discover, candidate-tests, external-benchmark]
    outputs:
      winner: ${{ steps.score.outputs.winner }}
      winner_branch: ${{ steps.score.outputs.winner_branch }}
      winner_sha: ${{ steps.score.outputs.winner_sha }}
      winner_score: ${{ steps.score.outputs.winner_score }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Read current verified record from main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Download candidate reports and test results
        uses: actions/download-artifact@v7
        with:
          pattern: candidate-*-${{ github.run_id }}
          path: ${{ runner.temp }}/tournament-artifacts
          merge-multiple: false
      - name: Rank complete holdout results against main with zero regressions
        id: score
        env:
          REPORT_ROOT: ${{ runner.temp }}/tournament-artifacts
          CANDIDATES_JSON: ${{ needs.discover.outputs.candidates }}
          REPORT_FILE: ${{ runner.temp }}/massive-tournament-report.md
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["REPORT_ROOT"])
          candidates = {item["name"]: item for item in json.loads(os.environ["CANDIDATES_JSON"])}
          tests = {}
          reports = {}
          for path in root.rglob("candidate-test-result.json"):
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
                  tests[item["candidate"]] = item
              except Exception as exc:
                  print(f"Reject invalid test result {path}: {exc}")

          for meta_path in root.rglob("candidate-meta.json"):
              try:
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  name = meta.get("candidate")
                  if name not in candidates or meta.get("sample") != "holdout" or meta.get("skip") != 500:
                      continue
                  report_path = meta_path.parent / "external-corpus-report.json"
                  status_path = meta_path.parent / "candidate-run-status.json"
                  if not report_path.is_file() or not status_path.is_file():
                      continue
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  status = json.loads(status_path.read_text(encoding="utf-8"))
                  rows = report.get("results", [])
                  ids = [row.get("id") for row in rows]
                  passed = sum(row.get("status") == "passed" for row in rows)
                  test = tests.get(name, {})
                  valid = (
                      status.get("outcome") == "success"
                      and meta.get("branch") == candidates[name]["branch"]
                      and meta.get("sha") == candidates[name]["sha"]
                      and report.get("tested") == 500
                      and report.get("target") == 500
                      and report.get("skip") == 500
                      and report.get("sample_complete") is True
                      and report.get("archive_md5_verified") is True
                      and len(rows) == 500 and len(set(ids)) == 500
                      and passed == report.get("passed")
                      and test.get("sha") == meta.get("sha")
                      and test.get("tests_passed") is True
                  )
                  if not valid:
                      print(f"REJECTED {name}: incomplete, mismatched SHA, failed tests, or invalid holdout")
                      continue
                  reports[name] = {row["id"]: row.get("status") == "passed" for row in rows}
              except Exception as exc:
                  print(f"Reject invalid artifact {meta_path}: {exc}")

          if "main-baseline" not in reports:
              raise SystemExit("Cannot rank candidates: complete, checksum-verified main baseline is missing.")
          baseline = reports["main-baseline"]
          baseline_passed = sum(baseline.values())
          print(f"Same-run main baseline: {baseline_passed}/500 ({baseline_passed/5:.1f}%)")
          scores = []
          for name, outcomes in reports.items():
              if name == "main-baseline":
                  continue
              gains = sum(not baseline[k] and outcomes[k] for k in baseline)
              regressions = sum(baseline[k] and not outcomes[k] for k in baseline)
              passed = sum(outcomes.values())
              scores.append((passed, gains, regressions, name, candidates[name]["sha"]))
          scores.sort(reverse=True)

          lines = [
              "## Holdout-only tournament — no automatic promotion",
              "",
              f"Same-run main baseline: **{baseline_passed}/500 ({baseline_passed/5:.1f}%)**.",
              "A candidate qualifies only with a complete 500/500 run, green full tests, at least one gained case, and **zero regressions by case ID**.",
              "",
              "| Rank | Candidate | Exact matches | Gains | Regressions | SHA |",
              "|---:|---|---:|---:|---:|---|",
          ]
          for rank, (passed, gains, regressions, name, sha) in enumerate(scores, 1):
              lines.append(f"| {rank} | {name} | {passed}/500 ({passed/5:.1f}%) | {gains} | {regressions} | `{sha[:12]}` |")
          qualified = [row for row in scores if row[1] >= 1 and row[2] == 0 and row[0] > baseline_passed]
          if qualified:
              lines += ["", "**Qualified for human review only:** " + ", ".join(row[3] for row in qualified) + ". No PR is merged and the baseline record is not changed."]
          else:
              lines += ["", "**No candidate qualifies.** No merge, no record update, and no automatic follow-up action."]
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          Path(os.environ["REPORT_FILE"]).write_text(summary, encoding="utf-8")
          print(summary)
          PY
      - name: Append verified run report to the experiment protocol
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/massive-tournament-report.md
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          COHORT_SIZE: ${{ inputs.cohort_size || 'auto' }}
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT_FILE" ]; then
            echo "No verified ranking report was produced; document was not updated."
            exit 0
          fi
          doc="docs/MASSIVE_PARALLEL_EXPERIMENT_PROTOCOL.md"
          if [ ! -f "$doc" ]; then
            echo "Protocol document is not present on main yet; merge PR #315 before running this workflow."
            exit 0
          fi
          {
            printf '\n\n---\n\n## Ejecución automática #%s (run %s)\n\n' "$RUN_NUMBER" "$RUN_ID"
            printf -- '- Evento: `%s`\n- Tamaño solicitado: `%s` candidatas (más baseline main)\n- Informe: https://github.com/%s/actions/runs/%s\n\n' "$EVENT_NAME" "$COHORT_SIZE" "$GITHUB_REPOSITORY" "$RUN_ID"
            cat "$REPORT_FILE"
          } >> "$doc"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$doc"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "docs: record massive tournament run #$RUN_NUMBER"
            git push origin HEAD:main
          fi

