name: tests

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise the standalone translator in Chromium
        run: python tests/browser_smoke.py

  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile translator
        run: python -m py_compile cobol2py.py

  gnucobol-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      - name: Compile reference COBOL program
        run: cobc -x -o /tmp/realtest samples/realtest.cbl
      - name: Compare COBOL and translated Python output
        run: |
          /tmp/realtest > /tmp/cobol.out
          python cobol2py.py samples/realtest.cbl > /tmp/realtest.py
          python /tmp/realtest.py > /tmp/python.out
          diff -u /tmp/cobol.out /tmp/python.out
      - name: Compare MOVE field-sizing semantics
        run: |
          cobc -x -o /tmp/move_semantics samples/move_semantics.cbl
          /tmp/move_semantics > /tmp/move-cobol.out
          python cobol2py.py samples/move_semantics.cbl > /tmp/move_semantics.py
          python /tmp/move_semantics.py > /tmp/move-python.out
          diff -u /tmp/move-cobol.out /tmp/move-python.out

      - name: Compare arithmetic receiving PIC size semantics
        run: |
          cobc -x -o /tmp/arithmetic_size samples/arithmetic_size.cbl
          /tmp/arithmetic_size > /tmp/arithmetic-cobol.out
          python cobol2py.py samples/arithmetic_size.cbl > /tmp/arithmetic_size.py
          python -m py_compile /tmp/arithmetic_size.py
          python /tmp/arithmetic_size.py > /tmp/arithmetic-python.out
          diff -u /tmp/arithmetic-cobol.out /tmp/arithmetic-python.out

      - name: Compare signed and implied-decimal MOVE semantics
        run: |
          cobc -x -o /tmp/numeric_semantics samples/numeric_semantics.cbl
          /tmp/numeric_semantics > /tmp/numeric-cobol.out
          python cobol2py.py samples/numeric_semantics.cbl > /tmp/numeric_semantics.py
          python -m py_compile /tmp/numeric_semantics.py
          python /tmp/numeric_semantics.py > /tmp/numeric-python.out
          diff -u /tmp/numeric-cobol.out /tmp/numeric-python.out

      - name: Compare EVALUATE control flow
        run: |
          cobc -x -o /tmp/evaluate_semantics samples/evaluate_semantics.cbl
          /tmp/evaluate_semantics > /tmp/evaluate-cobol.out
          python cobol2py.py samples/evaluate_semantics.cbl > /tmp/evaluate_semantics.py
          python -m py_compile /tmp/evaluate_semantics.py
          python /tmp/evaluate_semantics.py > /tmp/evaluate-python.out
          diff -u /tmp/evaluate-cobol.out /tmp/evaluate-python.out

      - name: Compare nested group data semantics
        run: |
          cobc -x -o /tmp/group_semantics samples/group_semantics.cbl
          /tmp/group_semantics > /tmp/group-cobol.out
          python cobol2py.py samples/group_semantics.cbl > /tmp/group_semantics.py
          python -m py_compile /tmp/group_semantics.py
          python /tmp/group_semantics.py > /tmp/group-python.out
          diff -u /tmp/group-cobol.out /tmp/group-python.out


  java-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      - name: Compare Java backend output with GnuCOBOL
        run: |
          cobc -x -o /tmp/java_backend_cobol samples/java_backend.cbl
          /tmp/java_backend_cobol > /tmp/java-backend-cobol.out
          python cobol2py.py samples/java_backend.cbl --lang java --out /tmp/Cobol2PyProgram.java
          javac -d /tmp /tmp/Cobol2PyProgram.java
          java -cp /tmp Cobol2PyProgram > /tmp/java-backend-java.out
          diff -u /tmp/java-backend-cobol.out /tmp/java-backend-java.out


  gnucobol-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      - name: Verify variable snapshots
        run: |
          python tools/gnucobol_trace.py samples/trace_demo.cbl --format fixed > /tmp/trace.out 2> /tmp/trace.err
          grep -F 'TRACE_VAR|WS-NAME|BOB  ' /tmp/trace.out
          grep -F 'TRACE_VAR|WS-COUNT|002' /tmp/trace.out
          grep -F 'TRACE_VAR|WS-GROUP|CH ' /tmp/trace.out
          grep -F 'TRACE_VAR|WS-CHILD|CH ' /tmp/trace.out
          grep -F 'TRACE_VAR|WS-TABLE(1)|03' /tmp/trace.out
          grep -F 'TRACE_VAR|WS-TABLE(2)|04' /tmp/trace.out

  modernization-agent:
    name: Modernization agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dedicated agent unit tests
        run: python -m unittest discover -s tests -p 'test_modernize_agent.py' -v
      - name: Test and smoke-test integrated modernization pilot
        run: |
          python -m unittest discover -s tests -p 'test_modernize_pilot.py' -v
          python tools/modernize_pilot.py samples --out-dir /tmp/cobol2py-pilot
          python -c "import json; p=json.load(open('/tmp/cobol2py-pilot/translation-report.json', encoding='utf-8')); s=p['translation_summary']; assert p['schema_version'] == 2; assert s['source_files'] > 0; assert s['syntax_errors'] == 0; assert s['translation_errors'] == 0; assert p['semantic_validation'] == 'not-performed'; assert p['validation']['semantics'] == 'not-evaluated'; assert 'diagnostic_classifications' in s; print('Pilot report OK:', json.dumps(s, ensure_ascii=False, sort_keys=True))"
          cat /tmp/cobol2py-pilot/translation-report.md
      - name: Run explicit differential pilot against GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          python tools/modernize_pilot.py samples --out-dir /tmp/cobol2py-pilot --differential
          python -c "import json; p=json.load(open('/tmp/cobol2py-pilot/translation-report.json', encoding='utf-8')); d=p['differential_validation']; assert p['semantic_validation'] == 'matched', p['semantic_validation']; assert d['case_count'] == 104, d['case_count']; assert all(x['status'] == 'matched' for x in d['cases']); print('Differential pilot matched:', d['case_count'], 'fixtures')"
          cat /tmp/cobol2py-pilot/translation-report.md
      - name: Publish pilot diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: modernization-pilot-diagnostics
          path: /tmp/cobol2py-pilot/
          if-no-files-found: error
          retention-days: 30

      - name: Smoke-test repository inventory and JSON report
        run: |
          python cobol2py_agent.py . --out /tmp/migration-plan.md --json-out /tmp/migration-plan.json
          python -c "import json; p=json.load(open('/tmp/migration-plan.json', encoding='utf-8')); assert p['schema_version'] == 1; assert isinstance(p['files'], list); assert isinstance(p['dependencies'], list); assert isinstance(p['unresolved_references'], list); assert isinstance(p['ambiguous_references'], list); assert isinstance(p['summary']['ambiguous_references'], int); print('Agent report schema OK; files:', p['summary']['files'])"
          test -s /tmp/migration-plan.md
