name: differential-benchmark

on:
  # Historical curated-fixture comparator: manual only, not a candidate score.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: differential-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision and history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Python and GnuCOBOL
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      - name: Resolve current main baseline
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --no-tags origin main
            BASELINE_SHA="$(git rev-parse FETCH_HEAD)"
          else
            BASELINE_SHA="$PUSH_BASE_SHA"
            git cat-file -e "$BASELINE_SHA^{commit}"
          fi
          git cat-file -e "$BASELINE_SHA:cobol2py.py"
          mkdir -p /tmp/cobol2py-baseline
          git show "$BASELINE_SHA:cobol2py.py" > /tmp/cobol2py-baseline/cobol2py.py
          echo "sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"
          echo "Baseline: main/previous revision $BASELINE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare main baseline and candidate on the same corpus
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          python benchmarks/run_benchmark.py \
            --manifest benchmarks/cases.json \
            --baseline-translator /tmp/cobol2py-baseline/cobol2py.py \
            --baseline-no-format-flag \
            --translator "$GITHUB_WORKSPACE/cobol2py.py" \
            --baseline-label "Main baseline (${BASELINE_SHA:0:7})" \
            --candidate-label "Candidate (${HEAD_SHA:0:7})" \
            --json benchmark-report.json \
            --markdown benchmark-report.md | tee /tmp/benchmark-console.md
          benchmark_status=${PIPESTATUS[0]}
          if [ -f benchmark-report.md ]; then
            cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$benchmark_status"
      - name: Upload machine-readable and human-readable reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: main-vs-candidate-benchmark-${{ github.run_number }}
          path: |
            benchmark-report.json
            benchmark-report.md
          if-no-files-found: warn
          retention-days: 90
