name: differential-benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python and GnuCOBOL
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      - name: Select baseline revision
        id: baseline
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          else
            BASE_SHA="$EVENT_BASE"
          fi
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA:cobol2py.py" 2>/dev/null; then
            mkdir -p /tmp/cobol2py-baseline
            git show "$BASE_SHA:cobol2py.py" > /tmp/cobol2py-baseline/cobol2py.py
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "sha=unavailable" >> "$GITHUB_OUTPUT"
          fi
      - name: Run paired GnuCOBOL differential benchmark
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ARGS=(
            --manifest benchmarks/cases.json
            --translator "$GITHUB_WORKSPACE/cobol2py.py"
            --candidate-label "$HEAD_SHA"
            --json benchmark-report.json
            --markdown benchmark-report.md
          )
          if [ "$BASELINE_AVAILABLE" = "true" ]; then
            ARGS+=(--baseline-translator /tmp/cobol2py-baseline/cobol2py.py --baseline-label "$BASELINE_SHA")
          fi
          python benchmarks/run_benchmark.py "${ARGS[@]}" | tee /tmp/benchmark-console.md
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload machine-readable and human-readable reports
        uses: actions/upload-artifact@v4
        with:
          name: differential-benchmark-${{ github.run_number }}
          path: |
            benchmark-report.json
            benchmark-report.md
          if-no-files-found: error
          retention-days: 90
