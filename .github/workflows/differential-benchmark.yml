name: differential-benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python and GnuCOBOL
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      - name: Prepare initial translator snapshot
        env:
          BASELINE_SHA: 02fde4baab3956e640111092e15291aa10a6a774
        run: |
          git cat-file -e "$BASELINE_SHA:cobol2py.py"
          mkdir -p /tmp/cobol2py-baseline
          git show "$BASELINE_SHA:cobol2py.py" > /tmp/cobol2py-baseline/cobol2py.py
          echo "Baseline: $BASELINE_SHA (initial translator snapshot)" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare initial snapshot and current translator on the same corpus
        shell: bash
        env:
          BASELINE_SHA: 02fde4baab3956e640111092e15291aa10a6a774
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          python benchmarks/run_benchmark.py \
            --manifest benchmarks/cases.json \
            --baseline-translator /tmp/cobol2py-baseline/cobol2py.py \
            --baseline-no-format-flag \
            --translator "$GITHUB_WORKSPACE/cobol2py.py" \
            --baseline-label "Initial snapshot (${BASELINE_SHA:0:7})" \
            --candidate-label "Current (${HEAD_SHA:0:7})" \
            --json benchmark-report.json \
            --markdown benchmark-report.md | tee /tmp/benchmark-console.md
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload machine-readable and human-readable reports
        uses: actions/upload-artifact@v4
        with:
          name: baseline-vs-current-benchmark-${{ github.run_number }}
          path: |
            benchmark-report.json
            benchmark-report.md
          if-no-files-found: error
          retention-days: 90
